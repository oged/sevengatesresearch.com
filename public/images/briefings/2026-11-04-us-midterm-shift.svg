<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">The projected 2026 US midterm shift</title>
  <desc id="desc">Democrats projected to flip six Republican Senate seats and at least eight House seats. Seventy percent of voters in an exit poll wanted Congress to provide stronger checks on the president.</desc>
  <rect width="1120" height="700" fill="#FBF8F1"/>
  <rect x="32" y="32" width="1056" height="636" rx="18" fill="#F4F0E8" stroke="#1A1F24" stroke-width="3"/>
  <text x="76" y="102" fill="#1A1F24" font-family="Georgia, serif" font-size="40" font-weight="700">The projected US midterm shift</text>
  <text x="76" y="140" fill="#46504F" font-family="Arial, sans-serif" font-size="20">Projected gains as of 6:00 a.m. London · 4 November 2026</text>
  <rect x="76" y="184" width="610" height="324" rx="14" fill="#FBF8F1" stroke="#C6BFAE" stroke-width="2"/>
  <text x="108" y="229" fill="#46504F" font-family="Arial, sans-serif" font-size="17" font-weight="700">REPUBLICAN-HELD SEATS FLIPPED BY DEMOCRATS</text>
  <line x1="188" y1="449" x2="628" y2="449" stroke="#1A1F24" stroke-width="2"/>
  <line x1="188" y1="445" x2="188" y2="454" stroke="#1A1F24" stroke-width="2"/>
  <line x1="298" y1="445" x2="298" y2="454" stroke="#1A1F24" stroke-width="2"/>
  <line x1="408" y1="445" x2="408" y2="454" stroke="#1A1F24" stroke-width="2"/>
  <line x1="518" y1="445" x2="518" y2="454" stroke="#1A1F24" stroke-width="2"/>
  <line x1="628" y1="445" x2="628" y2="454" stroke="#1A1F24" stroke-width="2"/>
  <text x="184" y="478" fill="#46504F" font-family="Arial, sans-serif" font-size="15">0</text>
  <text x="292" y="478" fill="#46504F" font-family="Arial, sans-serif" font-size="15">2</text>
  <text x="402" y="478" fill="#46504F" font-family="Arial, sans-serif" font-size="15">4</text>
  <text x="512" y="478" fill="#46504F" font-family="Arial, sans-serif" font-size="15">6</text>
  <text x="622" y="478" fill="#46504F" font-family="Arial, sans-serif" font-size="15">8</text>
  <text x="108" y="302" fill="#1A1F24" font-family="Arial, sans-serif" font-size="22" font-weight="700">Senate</text>
  <rect x="188" y="272" width="330" height="48" rx="8" fill="#A67C3D"/>
  <text x="536" y="305" fill="#1A1F24" font-family="Georgia, serif" font-size="34" font-weight="700">6</text>
  <text x="108" y="392" fill="#1A1F24" font-family="Arial, sans-serif" font-size="22" font-weight="700">House</text>
  <rect x="188" y="362" width="440" height="48" rx="8" fill="#1A1F24"/>
  <text x="641" y="395" fill="#1A1F24" font-family="Georgia, serif" font-size="34" font-weight="700">≥8</text>
  <rect x="720" y="184" width="324" height="324" rx="14" fill="#1A1F24"/>
  <text x="752" y="232" fill="#C69A52" font-family="Arial, sans-serif" font-size="17" font-weight="700">EXIT POLL</text>
  <text x="752" y="338" fill="#FBF8F1" font-family="Georgia, serif" font-size="82" font-weight="700">70%</text>
  <text x="752" y="382" fill="#FBF8F1" font-family="Arial, sans-serif" font-size="20">wanted stronger</text>
  <text x="752" y="414" fill="#FBF8F1" font-family="Arial, sans-serif" font-size="20">congressional checks</text>
  <text x="752" y="446" fill="#FBF8F1" font-family="Arial, sans-serif" font-size="20">on the president</text>
  <line x1="76" y1="550" x2="1044" y2="550" stroke="#A67C3D" stroke-width="2"/>
  <text x="76" y="590" fill="#1A1F24" font-family="Arial, sans-serif" font-size="18" font-weight="700">STATUS</text>
  <text x="160" y="590" fill="#46504F" font-family="Arial, sans-serif" font-size="18">Media projections. State canvass and certification determine official results.</text>
  <text x="76" y="630" fill="#46504F" font-family="Arial, sans-serif" font-size="15">Sources: Reuters election count and SSRS exit poll, 3–4 November; US Election Assistance Commission.</text>
</svg>
