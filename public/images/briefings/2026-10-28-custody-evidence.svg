<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">What Nigeria's custody panel established</title>
  <desc id="desc">About 50 detainees were held in roughly 20 square metres, equal to approximately 0.4 square metres per person before fixtures. The panel authenticated 33 deaths, including 14 minors, identified 41 survivors, and had three post-mortem examinations.</desc>
  <rect width="1120" height="700" fill="#FBF8F1"/>
  <rect x="32" y="32" width="1056" height="636" rx="4" fill="#F4F0E8" stroke="#1A1F24" stroke-width="2"/>
  <rect x="32" y="32" width="1056" height="96" fill="#1A1F24"/>
  <text x="72" y="76" fill="#C69A52" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.4">NIGERIA · CUSTODY INQUIRY · 27 OCTOBER 2026</text>
  <text x="72" y="109" fill="#FBF8F1" font-family="Georgia, serif" font-size="28" font-weight="700">What the panel established, and what constrained the evidence</text>

  <text x="72" y="177" fill="#46504F" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">REPORTED CONDITIONS</text>
  <rect x="72" y="199" width="570" height="300" fill="#FBF8F1" stroke="#1A1F24" stroke-width="3"/>
  <path d="M72 229 H642 M102 199 V499" stroke="#C6BFAE" stroke-width="2" stroke-dasharray="7 9"/>
  <text x="114" y="281" fill="#1A1F24" font-family="Georgia, serif" font-size="84" font-weight="700">≈50</text>
  <text x="116" y="318" fill="#46504F" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">MALE DETAINEES</text>
  <line x1="115" y1="347" x2="365" y2="347" stroke="#A67C3D" stroke-width="4"/>
  <text x="114" y="398" fill="#1A1F24" font-family="Georgia, serif" font-size="49" font-weight="700">≈20 m²</text>
  <text x="116" y="432" fill="#46504F" font-family="Arial, sans-serif" font-size="16">reported cell area</text>
  <rect x="380" y="249" width="240" height="175" rx="3" fill="#46160F"/>
  <text x="500" y="292" text-anchor="middle" fill="#E0B268" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">CALCULATED DENSITY</text>
  <text x="500" y="354" text-anchor="middle" fill="#FBF8F1" font-family="Georgia, serif" font-size="44" font-weight="700">≈0.4 m²</text>
  <text x="500" y="388" text-anchor="middle" fill="#FBF8F1" font-family="Arial, sans-serif" font-size="15">per detainee</text>
  <text x="500" y="411" text-anchor="middle" fill="#E0B268" font-family="Arial, sans-serif" font-size="12">before fixtures</text>

  <text x="693" y="177" fill="#46504F" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">AUTHENTICATED AND IDENTIFIED</text>
  <rect x="693" y="199" width="355" height="300" fill="#FBF8F1" stroke="#1A1F24" stroke-width="2"/>
  <line x1="693" y1="274" x2="1048" y2="274" stroke="#C6BFAE"/>
  <line x1="693" y1="349" x2="1048" y2="349" stroke="#C6BFAE"/>
  <line x1="693" y1="424" x2="1048" y2="424" stroke="#C6BFAE"/>
  <text x="728" y="251" fill="#8B2E24" font-family="Georgia, serif" font-size="44" font-weight="700">33</text>
  <text x="820" y="244" fill="#1A1F24" font-family="Arial, sans-serif" font-size="17" font-weight="700">deaths</text>
  <text x="820" y="263" fill="#46504F" font-family="Arial, sans-serif" font-size="13">initial reports said 37</text>
  <text x="728" y="327" fill="#8B2E24" font-family="Georgia, serif" font-size="44" font-weight="700">14</text>
  <text x="820" y="320" fill="#1A1F24" font-family="Arial, sans-serif" font-size="17" font-weight="700">minors among the dead</text>
  <text x="728" y="402" fill="#1A1F24" font-family="Georgia, serif" font-size="44" font-weight="700">41</text>
  <text x="820" y="395" fill="#1A1F24" font-family="Arial, sans-serif" font-size="17" font-weight="700">survivors identified</text>
  <text x="728" y="477" fill="#A67C3D" font-family="Georgia, serif" font-size="44" font-weight="700">3</text>
  <text x="820" y="465" fill="#1A1F24" font-family="Arial, sans-serif" font-size="17" font-weight="700">post-mortems</text>
  <text x="820" y="486" fill="#46504F" font-family="Arial, sans-serif" font-size="13">30 bodies already buried</text>

  <rect x="72" y="531" width="976" height="76" fill="#1A1F24"/>
  <text x="96" y="561" fill="#C69A52" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.3">PANEL FINDING</text>
  <text x="96" y="589" fill="#FBF8F1" font-family="Georgia, serif" font-size="21">Environmental asphyxia, aggravated by heat and dehydration; deaths found preventable.</text>
  <text x="72" y="640" fill="#46504F" font-family="Arial, sans-serif" font-size="12">Source: Federal investigative committee presentation, 27 October 2026, reported by Punch. Area per person: Seven Gates calculation. Not a floor-plan reconstruction.</text>
</svg>
