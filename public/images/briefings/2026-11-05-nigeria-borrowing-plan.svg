<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Nigeria's planned new borrowing in the 2026 budget</title>
  <desc id="desc">Zero-based bars compare 18.4 trillion naira of planned domestic borrowing with 10.79 trillion naira of planned external borrowing, totaling 29.2 trillion naira.</desc>
  <rect width="1120" height="700" fill="#FBF8F1"/>
  <rect x="32" y="32" width="1056" height="636" rx="18" fill="#F4F0E8" stroke="#1A1F24" stroke-width="3"/>
  <text x="76" y="102" fill="#1A1F24" font-family="Georgia, serif" font-size="40" font-weight="700">Nigeria's 2026 borrowing plan</text>
  <text x="76" y="140" fill="#46504F" font-family="Arial, sans-serif" font-size="20">Planned new borrowing · ₦ trillion · common zero baseline</text>
  <rect x="76" y="184" width="968" height="334" rx="14" fill="#FBF8F1" stroke="#C6BFAE" stroke-width="2"/>
  <text x="110" y="248" fill="#1A1F24" font-family="Arial, sans-serif" font-size="21" font-weight="700">Domestic</text>
  <rect x="270" y="210" width="644" height="56" rx="8" fill="#1A1F24"/>
  <text x="930" y="250" fill="#1A1F24" font-family="Georgia, serif" font-size="34" font-weight="700">18.4</text>
  <text x="110" y="350" fill="#1A1F24" font-family="Arial, sans-serif" font-size="21" font-weight="700">External</text>
  <rect x="270" y="312" width="378" height="56" rx="8" fill="#A67C3D"/>
  <text x="664" y="352" fill="#1A1F24" font-family="Georgia, serif" font-size="34" font-weight="700">10.79</text>
  <line x1="270" y1="420" x2="970" y2="420" stroke="#1A1F24" stroke-width="2"/>
  <line x1="270" y1="414" x2="270" y2="428" stroke="#1A1F24" stroke-width="2"/>
  <line x1="445" y1="414" x2="445" y2="428" stroke="#1A1F24" stroke-width="2"/>
  <line x1="620" y1="414" x2="620" y2="428" stroke="#1A1F24" stroke-width="2"/>
  <line x1="795" y1="414" x2="795" y2="428" stroke="#1A1F24" stroke-width="2"/>
  <line x1="970" y1="414" x2="970" y2="428" stroke="#1A1F24" stroke-width="2"/>
  <text x="265" y="453" fill="#46504F" font-family="Arial, sans-serif" font-size="15">0</text>
  <text x="440" y="453" fill="#46504F" font-family="Arial, sans-serif" font-size="15">5</text>
  <text x="611" y="453" fill="#46504F" font-family="Arial, sans-serif" font-size="15">10</text>
  <text x="786" y="453" fill="#46504F" font-family="Arial, sans-serif" font-size="15">15</text>
  <text x="960" y="453" fill="#46504F" font-family="Arial, sans-serif" font-size="15">20</text>
  <rect x="110" y="474" width="824" height="1" fill="#C6BFAE"/>
  <text x="110" y="499" fill="#46504F" font-family="Arial, sans-serif" font-size="17">External component: about $7.7bn at the budget rate of ₦1,400/$</text>
  <line x1="76" y1="558" x2="1044" y2="558" stroke="#A67C3D" stroke-width="2"/>
  <text x="76" y="600" fill="#1A1F24" font-family="Arial, sans-serif" font-size="18" font-weight="700">TOTAL</text>
  <text x="156" y="600" fill="#1A1F24" font-family="Georgia, serif" font-size="32" font-weight="700">₦29.2tn</text>
  <text x="332" y="600" fill="#46504F" font-family="Arial, sans-serif" font-size="18">Authorised financing plan, not cash already raised</text>
  <text x="76" y="640" fill="#46504F" font-family="Arial, sans-serif" font-size="15">Sources: 2026 Appropriation Act; presidential request presented to the Senate, 4 November 2026.</text>
</svg>
