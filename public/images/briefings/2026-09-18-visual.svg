<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc">
<title id="title">Three routes out of quantitative easing</title>
<desc id="desc">Bank of England September 2026 gilt plan. Of 488 billion pounds, 120 billion is retained for banknote backing, 222 billion matures, and 146 billion is sold. Monetary-policy unwind totals 368 billion pounds.</desc>
<rect width="800" height="760" fill="#172521"/><rect x="20" y="20" width="760" height="720" rx="3" fill="#F4F0E6"/>
<g font-family="Arial, sans-serif" fill="#172521">
<text x="54" y="66" font-size="16" letter-spacing="3" fill="#8A7042">SEVEN GATES / THE POLICY LEDGER</text>
<text x="54" y="118" font-family="Georgia, serif" font-size="38">Three routes out of QE</text>
<text x="54" y="154" font-size="20">Britain’s new gilt plan, announced 17 September</text>
<line x1="54" x2="746" y1="181" y2="181" stroke="#B19A6C"/>
<text x="54" y="226" font-size="18" letter-spacing="2">STARTING STOCK</text>
<text x="746" y="232" text-anchor="end" font-size="42" font-family="Georgia, serif">£488bn</text>
<rect x="54" y="265" width="692" height="102" fill="#E8E0D0"/>
<text x="78" y="302" font-size="18" letter-spacing="1">RETAIN</text>
<text x="78" y="337" font-size="20">Back current and future banknotes</text>
<text x="722" y="326" text-anchor="end" font-size="36" font-family="Georgia, serif">£120bn</text>
<rect x="54" y="383" width="692" height="102" fill="#FFFFFF" stroke="#CDC3B0"/>
<text x="78" y="420" font-size="18" letter-spacing="1">LET MATURE</text>
<text x="78" y="455" font-size="20">Passive redemptions</text>
<text x="722" y="444" text-anchor="end" font-size="36" font-family="Georgia, serif">£222bn</text>
<rect x="54" y="501" width="692" height="102" fill="#FFFFFF" stroke="#CDC3B0"/>
<text x="78" y="538" font-size="18" letter-spacing="1">SELL</text>
<text x="78" y="573" font-size="20">Active portfolio reduction</text>
<text x="722" y="562" text-anchor="end" font-size="36" font-family="Georgia, serif">£146bn</text>
<text x="54" y="643" font-size="22" font-weight="bold">£222bn + £146bn = £368bn to unwind</text>
<text x="54" y="675" font-size="18">Planned completion: 2034. Cards are not to scale.</text>
<text x="54" y="713" font-size="15" fill="#655D50">Source: Bank of England, September 2026 minutes, paragraphs 40–45.</text>
</g></svg>
