<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1. The IPO's reach must become active ownership</title>
  <desc id="desc">Three connected panels show about 12 million Nigerian capital-market participants, only hundreds of thousands who trade actively, and the NGX chief executive's expectation that the Dangote refinery offer could multiply active investors by three to five times.</desc>
  <rect width="640" height="700" fill="#FBF8F1"/>
  <rect x="12" y="12" width="616" height="676" rx="4" fill="none" stroke="#1A1F24" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1A1F24">
    <text x="36" y="52" font-size="21" letter-spacing="2" fill="#A67C3D">FIGURE 1 · 23 OCTOBER 2026</text>
    <text x="36" y="94" font-size="30" font-weight="700">The IPO's reach must become</text>
    <text x="36" y="130" font-size="30" font-weight="700">active ownership</text>
    <text x="36" y="165" font-size="21" fill="#46504F">Nigeria capital-market participation</text>

    <rect x="36" y="202" width="568" height="100" rx="4" fill="#1A1F24"/>
    <text x="58" y="234" font-size="17" letter-spacing="1.4" fill="#A67C3D">REPORTED REACH</text>
    <text x="58" y="278" font-size="34" font-weight="700" fill="#FBF8F1">~12 million</text>
    <text x="360" y="263" font-size="21" fill="#FBF8F1">about 5% of Nigerians</text>

    <path d="M320 302 V328" stroke="#A67C3D" stroke-width="4"/>
    <path d="M311 320 L320 330 L329 320" fill="none" stroke="#A67C3D" stroke-width="4"/>

    <rect x="36" y="330" width="568" height="100" rx="4" fill="#FFFFFF" stroke="#C6BFAE" stroke-width="2"/>
    <text x="58" y="362" font-size="17" letter-spacing="1.4" fill="#A67C3D">ACTIVE USE TODAY</text>
    <text x="58" y="406" font-size="32" font-weight="700">Hundreds of thousands</text>
    <text x="445" y="394" font-size="20" fill="#46504F">trade actively</text>

    <path d="M320 430 V456" stroke="#A67C3D" stroke-width="4"/>
    <path d="M311 448 L320 458 L329 448" fill="none" stroke="#A67C3D" stroke-width="4"/>

    <rect x="36" y="458" width="568" height="100" rx="4" fill="#FFFFFF" stroke="#A67C3D" stroke-width="3"/>
    <text x="58" y="490" font-size="17" letter-spacing="1.4" fill="#A67C3D">OFFER AMBITION</text>
    <text x="58" y="534" font-size="36" font-weight="700">3 to 5 times</text>
    <text x="300" y="520" font-size="20" fill="#46504F">the active investor base</text>
    <text x="300" y="544" font-size="18" fill="#46504F">expectation, not an observed result</text>

    <text x="36" y="600" font-size="20" font-weight="700">The post-listing test:</text>
    <text x="36" y="628" font-size="19">funded accounts, clean allotment and repeat activity.</text>
    <path d="M36 650 H604" stroke="#C6BFAE"/>
    <text x="36" y="677" font-size="17" fill="#46504F">Source: NGX Group CEO via Reuters, 22 October 2026.</text>
  </g>
</svg>
