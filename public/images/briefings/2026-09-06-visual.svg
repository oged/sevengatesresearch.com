<text x="70" y="296" class="rank">01</text><rect x="150" y="260" width="930" height="72" rx="12" fill="#0B1F33" stroke="#0B1F33" stroke-width="2"/><text x="178" y="291" class="labelLight">IRAN&apos;S OIL FLEET UNDER FIRE</text><text x="178" y="319" class="detailLight">Three IRGC tankers disabled or destroyed after missiles at US warships.</text><text x="1108" y="307" class="valueSmall">$95.29 Brent</text><text x="70" y="391" class="rank">02</text><rect x="150" y="355" width="785" height="72" rx="12" fill="#FFFFFF" stroke="#EDE4D3" stroke-width="2"/><text x="178" y="386" class="label">ENVOYS IN KYIV</text><text x="178" y="414" class="detail">Putin talks ran 3h 10m; strikes paused on two capitals only.</text><text x="963" y="402" class="valueSmall">3h 10m</text><text x="70" y="486" class="rank">03</text><rect x="150" y="450" width="640" height="72" rx="12" fill="#FFFFFF" stroke="#EDE4D3" stroke-width="2"/><text x="178" y="481" class="label">AGOA EXTENDED</text><text x="178" y="509" class="detail">Duty-free access restored for 32 countries incl. Nigeria.</text><text x="818" y="497" class="valueSmall">To Dec 2028</text><text x="70" y="581" class="rank">04</text><rect x="150" y="545" width="495" height="72" rx="12" fill="#FFFFFF" stroke="#EDE4D3" stroke-width="2"/><text x="178" y="576" class="label">COMMERCIAL DOLLAR DEBT</text><text x="178" y="604" class="detail">Federal syndicated loans, from $133.66m.</text><text x="673" y="592" class="valueSmall">$2.86bn</text>
