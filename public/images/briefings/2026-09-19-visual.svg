<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc">
<title id="title">The barrel now has a postcode</title>
<desc id="desc">Indicative oil price ladder for 18 September 2026: Brent at 103 dollars and 18 cents, Urals at about 110 dollars, and ESPO above 120 dollars per barrel. ESPO traded at a 20 to 30 dollar premium to Brent.</desc>
<rect width="800" height="760" fill="#172521"/>
<rect x="20" y="20" width="760" height="720" rx="3" fill="#F4F0E6"/>
<g font-family="Arial, sans-serif" fill="#172521">
  <text x="54" y="66" font-size="16" letter-spacing="3" fill="#8A7042">SEVEN GATES / THE PHYSICAL BARREL</text>
  <text x="54" y="119" font-family="Georgia, serif" font-size="38">The barrel now has a postcode</text>
  <text x="54" y="156" font-size="20">Indicative price observations, 18 September 2026</text>
  <line x1="54" x2="746" y1="183" y2="183" stroke="#B19A6C"/>

  <rect x="54" y="224" width="574" height="104" fill="#FFFFFF" stroke="#CDC3B0"/>
  <text x="78" y="262" font-size="18" letter-spacing="1">BRENT</text>
  <text x="78" y="297" font-size="18" fill="#655D50">Global futures benchmark</text>
  <text x="722" y="293" text-anchor="end" font-size="43" font-family="Georgia, serif">$103.18</text>

  <rect x="54" y="350" width="612" height="104" fill="#FFFFFF" stroke="#CDC3B0"/>
  <text x="78" y="388" font-size="18" letter-spacing="1">URALS</text>
  <text x="78" y="423" font-size="18" fill="#655D50">Russian export grade</text>
  <text x="722" y="419" text-anchor="end" font-size="43" font-family="Georgia, serif">~$110</text>

  <rect x="54" y="476" width="668" height="104" fill="#E8E0D0" stroke="#B19A6C"/>
  <text x="78" y="514" font-size="18" letter-spacing="1">ESPO</text>
  <text x="78" y="549" font-size="18" fill="#655D50">Russian Far East grade</text>
  <text x="722" y="545" text-anchor="end" font-size="43" font-family="Georgia, serif">&gt;$120</text>

  <text x="54" y="626" font-size="22" font-weight="bold">ESPO premium to Brent: $20–$30 per barrel</text>
  <text x="54" y="659" font-size="17">Grades, locations, cargoes and delivery terms differ.</text>
  <text x="54" y="685" font-size="17">This is a price ladder, not a like-for-like futures curve.</text>
  <text x="54" y="717" font-size="14" fill="#655D50">Sources: Reuters market reporting and calculations, 18 September 2026.</text>
</g>
</svg>
