<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1. The growth target sits well above the forecasts</title>
  <desc id="desc">Horizontal bars on a shared zero-to-eight-percent scale show IMF Nigeria real GDP growth forecasts of 4.2 percent for 2026 and 4.3 percent for 2027, and the Nigerian government's target of about 7 percent average growth over five years. The target is not a forecast and has a different horizon.</desc>
  <rect width="640" height="700" fill="#FBF8F1"/>
  <rect x="12" y="12" width="616" height="676" rx="4" fill="none" stroke="#1A1F24" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1A1F24">
    <text x="36" y="52" font-size="21" letter-spacing="2" fill="#A67C3D">FIGURE 1 · 22 OCTOBER 2026</text>
    <text x="36" y="94" font-size="30" font-weight="700">The growth target sits</text>
    <text x="36" y="130" font-size="30" font-weight="700">well above the forecasts</text>
    <text x="36" y="168" font-size="23" fill="#46504F">Nigeria real GDP growth · per cent</text>
    <g stroke="#C6BFAE" stroke-width="1">
      <path d="M200 210 V488 M295 210 V488 M390 210 V488 M485 210 V488 M580 210 V488"/>
    </g>
    <text x="36" y="250" font-size="23" font-weight="700">IMF 2026</text>
    <text x="36" y="279" font-size="19" fill="#46504F">forecast</text>
    <rect x="200" y="238" width="199.5" height="42" fill="#1A1F24"/>
    <text x="410" y="269" font-size="27" font-weight="700">4.2%</text>
    <text x="36" y="352" font-size="23" font-weight="700">IMF 2027</text>
    <text x="36" y="381" font-size="19" fill="#46504F">forecast</text>
    <rect x="200" y="340" width="204.25" height="42" fill="#46504F"/>
    <text x="415" y="371" font-size="27" font-weight="700">4.3%</text>
    <text x="36" y="454" font-size="23" font-weight="700">Government</text>
    <text x="36" y="483" font-size="19" fill="#46504F">5-year avg target</text>
    <rect x="200" y="442" width="332.5" height="42" fill="#A67C3D"/>
    <text x="543" y="473" font-size="27" font-weight="700">~7%</text>
    <path d="M200 508 H580" stroke="#1A1F24" stroke-width="2"/>
    <g font-size="21" text-anchor="middle">
      <text x="200" y="538">0</text><text x="295" y="538">2</text><text x="390" y="538">4</text><text x="485" y="538">6</text><text x="580" y="538">8%</text>
    </g>
    <text x="36" y="582" font-size="21" font-weight="700">The target is not an IMF forecast.</text>
    <text x="36" y="611" font-size="20">Its horizon also differs from the annual forecasts.</text>
    <path d="M36 634 H604" stroke="#C6BFAE"/>
    <text x="36" y="663" font-size="18" fill="#46504F">Sources: IMF October 2026 WEO; Reuters, 21 October.</text>
  </g>
</svg>
