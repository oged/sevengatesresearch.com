<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Today's transmission board</title>
  <desc id="desc">A four-item factual board linking the Hormuz conflict, US rate expectations, Dangote's share offer and Nvidia's Hugging Face acquisition to their market transmission channels.</desc>
  <style>
    .eyebrow{font:700 18px Arial,sans-serif;letter-spacing:3px;fill:#B08A3E}
    .title{font:700 50px Georgia,serif;fill:#0B1F33}
    .subtitle{font:400 24px Arial,sans-serif;fill:#64707B}
    .label{font:700 15px Arial,sans-serif;letter-spacing:1.4px;fill:#B08A3E}
    .bigValue{font:700 42px Georgia,serif;fill:#0B1F33}
    .subValue{font:400 16px Arial,sans-serif;fill:#0B1F33}
    .detail{font:400 15px Arial,sans-serif;fill:#0B1F33}
    .source{font:400 15px Arial,sans-serif;fill:#64707B}
  </style>
  <rect width="1400" height="760" fill="#F5F0E6"/>
  <rect x="0" y="0" width="1400" height="14" fill="#0B1F33"/>
  <text x="55" y="72" class="eyebrow">SEVEN GATES RESEARCH · VISUAL OF THE DAY</text>
  <text x="55" y="142" class="title">Today's transmission board</text>
  <text x="55" y="190" class="subtitle">How the principal shocks move from events into prices, policy and Nigerian assets</text>
  <rect x="55" y="270" width="280" height="300" rx="18" fill="#FFFFFF" stroke="#B08A3E" stroke-width="4"/>
  <text x="79" y="312" class="label">HORMUZ TO INFLATION</text>
  <text x="79" y="368" class="bigValue">$97.48</text>
  <text x="79" y="398" class="subValue">Brent, +7.8% last week</text>
  <text x="79" y="450" class="detail">Weekend strikes on shipping</text>
  <text x="79" y="474" class="detail">lifted crude and revived</text>
  <text x="79" y="498" class="detail">global inflation pressure.</text>
  <path d="M 345 420 L 370 420" stroke="#B08A3E" stroke-width="4"/>
  <path d="M 365 411 L 375 420 L 365 429" fill="none" stroke="#B08A3E" stroke-width="4"/>
  <rect x="380" y="270" width="280" height="300" rx="18" fill="#FFFFFF" stroke="#EDE4D3" stroke-width="2"/>
  <text x="404" y="312" class="label">JOBS TO DOLLAR RATES</text>
  <text x="404" y="368" class="bigValue">58%</text>
  <text x="404" y="398" class="subValue">Fed hike odds, 16 Sep</text>
  <text x="404" y="450" class="detail">August payrolls beat with</text>
  <text x="404" y="474" class="detail">162k added, jobless at 4.1%,</text>
  <text x="404" y="498" class="detail">lifting rate expectations.</text>
  <path d="M 670 420 L 695 420" stroke="#B08A3E" stroke-width="4"/>
  <path d="M 690 411 L 700 420 L 690 429" fill="none" stroke="#B08A3E" stroke-width="4"/>
  <rect x="705" y="270" width="280" height="300" rx="18" fill="#FFFFFF" stroke="#EDE4D3" stroke-width="2"/>
  <text x="729" y="312" class="label">REFINERY TO NGX LIQUIDITY</text>
  <text x="729" y="368" class="bigValue">N2.15tn</text>
  <text x="729" y="398" class="subValue">Dangote max raise</text>
  <text x="729" y="450" class="detail">4.1bn shares at N525 could</text>
  <text x="729" y="474" class="detail">redirect substantial capital</text>
  <text x="729" y="498" class="detail">from other NGX counters.</text>
  <path d="M 995 420 L 1020 420" stroke="#B08A3E" stroke-width="4"/>
  <path d="M 1015 411 L 1025 420 L 1015 429" fill="none" stroke="#B08A3E" stroke-width="4"/>
  <rect x="1030" y="270" width="280" height="300" rx="18" fill="#FFFFFF" stroke="#EDE4D3" stroke-width="2"/>
  <text x="1054" y="312" class="label">CHIPS TO MODEL LAYER</text>
  <text x="1054" y="368" class="bigValue">$12.93bn</text>
  <text x="1054" y="398" class="subValue">Nvidia buys Hugging Face</text>
  <text x="1054" y="450" class="detail">Compute champion extends</text>
  <text x="1054" y="474" class="detail">into model distribution;</text>
  <text x="1054" y="498" class="detail">neutrality claim to be tested.</text>
  <line x1="55" y1="690" x2="1345" y2="690" stroke="#EDE4D3" stroke-width="2"/>
  <text x="55" y="724" class="source">Sources: Reuters via MarketScreener UK · US Bureau of Labor Statistics · OPEC · Proshare. Seven Gates Research, 2026-09-07.</text>
</svg>
