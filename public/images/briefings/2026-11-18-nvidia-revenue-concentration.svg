<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Data Center supplied 92.9 percent of NVIDIA revenue</title>
  <desc id="desc">NVIDIA reported 115.8 billion dollars of third-quarter fiscal 2027 revenue, comprising 107.6 billion dollars from Data Center and 8.2 billion dollars from all other businesses.</desc>
  <rect width="1120" height="700" fill="#FBF8F1"/>
  <rect x="28" y="28" width="1064" height="644" rx="20" fill="#F4F0E8" stroke="#1A1F24" stroke-width="4"/>
  <text x="76" y="96" fill="#1A1F24" font-family="Georgia, serif" font-size="41" font-weight="700">Data Center supplied 92.9% of revenue</text>
  <text x="76" y="136" fill="#46504F" font-family="Arial, sans-serif" font-size="19">NVIDIA Q3 FY2027 revenue, US$ billions</text>

  <rect x="76" y="182" width="968" height="278" rx="14" fill="#FBF8F1" stroke="#C6BFAE" stroke-width="2"/>
  <text x="108" y="228" fill="#1A1F24" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.3">REVENUE COMPOSITION</text>
  <rect x="108" y="274" width="861" height="92" rx="8" fill="#A67C3D"/>
  <rect x="969" y="274" width="65" height="92" rx="8" fill="#1A1F24"/>
  <text x="538" y="326" text-anchor="middle" fill="#FBF8F1" font-family="Arial, sans-serif" font-size="30" font-weight="700">DATA CENTER  $107.6bn</text>
  <line x1="1001" y1="372" x2="1001" y2="404" stroke="#1A1F24" stroke-width="2"/>
  <text x="1001" y="430" text-anchor="middle" fill="#1A1F24" font-family="Arial, sans-serif" font-size="18" font-weight="700">OTHER  $8.2bn</text>

  <rect x="76" y="492" width="968" height="104" rx="12" fill="#1A1F24"/>
  <text x="108" y="534" fill="#C69A52" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">TOTAL REVENUE</text>
  <text x="108" y="575" fill="#FBF8F1" font-family="Georgia, serif" font-size="38" font-weight="700">$115.8bn</text>
  <text x="566" y="534" fill="#C6BFAE" font-family="Arial, sans-serif" font-size="17" font-weight="700">YEAR ON YEAR</text>
  <text x="566" y="575" fill="#FBF8F1" font-family="Georgia, serif" font-size="38" font-weight="700">Total +103%   Data Center +110%</text>

  <text x="76" y="632" fill="#46504F" font-family="Arial, sans-serif" font-size="15">Source: NVIDIA, 17 Nov 2026. Other and 92.9% share are Seven Gates calculations from company totals.</text>
</svg>
