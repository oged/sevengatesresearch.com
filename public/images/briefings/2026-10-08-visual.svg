<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Nearly all the demand chose one year</title>
  <desc id="desc">Grouped bars compare Nigerian Treasury bill offer, subscriptions and allotments at the 7 October 2026 auction. The 364-day bill attracted 1,683.4 billion naira of subscriptions, far more than the shorter tenors.</desc>
  <rect width="1200" height="675" fill="#FBF8F1"/>
  <rect x="34" y="34" width="1132" height="607" rx="8" fill="none" stroke="#1A1F24" stroke-width="3"/>
  <text x="82" y="102" fill="#A67C3D" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">SEVEN GATES DAILY BRIEF</text>
  <text x="82" y="154" fill="#1A1F24" font-family="Georgia, serif" font-size="42" font-weight="700">Nearly all the demand chose one year</text>
  <text x="82" y="190" fill="#46504F" font-family="Arial, sans-serif" font-size="19">Nigerian Treasury-bill auction · ₦ billion · 7 October 2026</text>

  <rect x="720" y="91" width="18" height="18" fill="#C6BFAE"/>
  <text x="748" y="106" fill="#46504F" font-family="Arial, sans-serif" font-size="16">Offer</text>
  <rect x="820" y="91" width="18" height="18" fill="#A67C3D"/>
  <text x="848" y="106" fill="#46504F" font-family="Arial, sans-serif" font-size="16">Subscriptions</text>
  <rect x="1004" y="91" width="18" height="18" fill="#1A1F24"/>
  <text x="1032" y="106" fill="#46504F" font-family="Arial, sans-serif" font-size="16">Allotted</text>

  <line x1="105" y1="535" x2="1095" y2="535" stroke="#1A1F24" stroke-width="2"/>
  <line x1="105" y1="455" x2="1095" y2="455" stroke="#C6BFAE" stroke-width="1"/>
  <line x1="105" y1="375" x2="1095" y2="375" stroke="#C6BFAE" stroke-width="1"/>
  <line x1="105" y1="295" x2="1095" y2="295" stroke="#C6BFAE" stroke-width="1"/>
  <line x1="105" y1="215" x2="1095" y2="215" stroke="#C6BFAE" stroke-width="1"/>
  <text x="88" y="541" text-anchor="end" fill="#46504F" font-family="Arial, sans-serif" font-size="15">0</text>
  <text x="88" y="461" text-anchor="end" fill="#46504F" font-family="Arial, sans-serif" font-size="15">500</text>
  <text x="88" y="381" text-anchor="end" fill="#46504F" font-family="Arial, sans-serif" font-size="15">1,000</text>
  <text x="88" y="301" text-anchor="end" fill="#46504F" font-family="Arial, sans-serif" font-size="15">1,500</text>
  <text x="88" y="221" text-anchor="end" fill="#46504F" font-family="Arial, sans-serif" font-size="15">2,000</text>

  <rect x="190" y="519" width="54" height="16" fill="#C6BFAE"/>
  <rect x="252" y="528.7" width="54" height="6.3" fill="#A67C3D"/>
  <rect x="314" y="528.8" width="54" height="6.2" fill="#1A1F24"/>
  <text x="279" y="500" text-anchor="middle" fill="#1A1F24" font-family="Arial, sans-serif" font-size="19" font-weight="700">100 · 39.4 · 38.6</text>
  <text x="279" y="570" text-anchor="middle" fill="#46504F" font-family="Arial, sans-serif" font-size="19">91-day</text>

  <rect x="476" y="519" width="54" height="16" fill="#C6BFAE"/>
  <rect x="538" y="527.5" width="54" height="7.5" fill="#A67C3D"/>
  <rect x="600" y="527.8" width="54" height="7.2" fill="#1A1F24"/>
  <text x="565" y="500" text-anchor="middle" fill="#1A1F24" font-family="Arial, sans-serif" font-size="19" font-weight="700">100 · 46.9 · 44.9</text>
  <text x="565" y="570" text-anchor="middle" fill="#46504F" font-family="Arial, sans-serif" font-size="19">182-day</text>

  <rect x="762" y="423" width="54" height="112" fill="#C6BFAE"/>
  <rect x="824" y="265.7" width="54" height="269.3" fill="#A67C3D"/>
  <rect x="886" y="393.4" width="54" height="141.6" fill="#1A1F24"/>
  <text x="851" y="245" text-anchor="middle" fill="#A67C3D" font-family="Arial, sans-serif" font-size="25" font-weight="700">1,683.4</text>
  <text x="851" y="570" text-anchor="middle" fill="#46504F" font-family="Arial, sans-serif" font-size="19">364-day</text>

  <text x="82" y="615" fill="#46504F" font-family="Arial, sans-serif" font-size="15">Source: CBN auction data reported by FMDA, 7 October 2026. Labels show offer · subscriptions · allotment.</text>
