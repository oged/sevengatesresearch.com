  <text x="60" y="73" fill="#C7A767" font-family="Georgia, serif" font-size="17" letter-spacing="3">PAPER BARREL · CARGO BARREL</text>
  <text x="60" y="119" fill="#F8F1E5" font-family="Georgia, serif" font-size="36" font-weight="700">The delivery gap is $14.</text>
  <text x="60" y="151" fill="#D8D0C2" font-family="Arial, sans-serif" font-size="15">European market observations · 15 September 2026</text>

  <rect x="60" y="218" width="292" height="170" fill="#E9DECB" stroke="#C7A767" stroke-width="2"/>
  <text x="86" y="255" fill="#5B6263" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">BRENT FUTURES</text>
  <text x="86" y="326" fill="#132A35" font-family="Georgia, serif" font-size="58" font-weight="700">~$108</text>
  <text x="86" y="360" fill="#5B6263" font-family="Arial, sans-serif" font-size="15">financial benchmark</text>

  <path d="M370 303 H412" stroke="#C7A767" stroke-width="4"/>
  <path d="M420 303 l-13 -10 v20 z" fill="#C7A767"/>

