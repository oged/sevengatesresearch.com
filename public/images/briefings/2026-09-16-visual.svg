  <text x="704" y="503" text-anchor="end" fill="#A64036" font-family="Georgia, serif" font-size="34" font-weight="700">≈13%</text>

  <rect x="60" y="562" width="680" height="140" fill="#132A35"/>
  <text x="86" y="598" fill="#C7A767" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">GULF EXPORT WORKAROUND</text>
  <text x="86" y="650" fill="#F8F1E5" font-family="Georgia, serif" font-size="40" font-weight="700">7m to 9m bpd</text>
  <text x="704" y="632" text-anchor="end" fill="#F8F1E5" font-family="Georgia, serif" font-size="25" font-weight="700">30% to 40%</text>
  <text x="704" y="658" text-anchor="end" fill="#D8D0C2" font-family="Arial, sans-serif" font-size="14">of pre-war volumes</text>
