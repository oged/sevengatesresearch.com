  <text x="464" y="255" fill="#C7A767" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">DATED BRENT</text>
  <text x="464" y="326" fill="#F8F1E5" font-family="Georgia, serif" font-size="58" font-weight="700">~$122</text>
  <text x="464" y="360" fill="#D8D0C2" font-family="Arial, sans-serif" font-size="15">physical cargo benchmark</text>

  <rect x="60" y="424" width="680" height="101" fill="#D8C8A9"/>
