<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc">
  <title id="title">The cargo barrel is 122 dollars</title>
  <desc id="desc">A factual comparison showing Brent futures near 108 dollars, dated Brent physical cargoes around 122 dollars, a calculated 14-dollar or approximately 13-percent delivery premium, and Gulf dark shipments at 7 to 9 million barrels per day, 30 to 40 percent of pre-war volumes.</desc>
  <rect width="800" height="760" fill="#F4ECDD"/>
  <rect x="26" y="26" width="748" height="708" fill="#F8F1E5" stroke="#132A35" stroke-width="4"/>
