<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-labelledby="title desc"><title id="title">Brazil's presidential election goes to a close runoff</title><desc id="desc">First-round valid-vote shares with 99.99 percent of ballot boxes counted: Flavio Bolsonaro 47.03 percent and Luiz Inacio Lula da Silva 45.16 percent. The gap is 1.87 percentage points.</desc><rect width="820" height="560" fill="#FBF8F1"/><rect x="14" y="14" width="792" height="532" fill="none" stroke="#1A1F24" stroke-width="2"/><g font-family="Arial,sans-serif" fill="#1A1F24"><text x="42" y="55" font-size="19" fill="#A67C3D">SEVEN GATES RESEARCH | FIGURE 1</text><text x="42" y="98" font-size="28" font-weight="bold">Brazil goes to a close presidential runoff</text><text x="42" y="131" font-size="20">First-round share of valid votes (%)</text><line x1="260" y1="185" x2="740" y2="185" stroke="#C6BFAE"/><line x1="260" y1="185" x2="260" y2="395" stroke="#1A1F24"/><line x1="500" y1="185" x2="500" y2="395" stroke="#C6BFAE" stroke-dasharray="6 6"/><line x1="740" y1="185" x2="740" y2="395" stroke="#C6BFAE"/><text x="252" y="172" font-size="16">0</text><text x="487" y="172" font-size="16">25</text><text x="727" y="172" font-size="16">50</text><text x="42" y="248" font-size="22">Flávio Bolsonaro</text><rect x="260" y="221" width="451.5" height="38" fill="#1A1F24"/><text x="720" y="248" font-size="22" font-weight="bold">47.03%</text><text x="42" y="330" font-size="22">Luiz Inácio Lula da Silva</text><rect x="260" y="303" width="433.5" height="38" fill="#A67C3D"/><text x="702" y="330" font-size="22" font-weight="bold">45.16%</text><rect x="42" y="403" width="736" height="66" fill="#F4F0E8" stroke="#C6BFAE"/><text x="62" y="432" font-size="18">First-round gap</text><text x="62" y="458" font-size="27" font-weight="bold" fill="#A67C3D">1.87 percentage points</text><text x="42" y="505" font-size="17">99.99% of ballot boxes counted at 00:11 on 5 Oct 2026.</text><text x="42" y="531" font-size="17">Source: Tribunal Superior Eleitoral. Runoff scheduled for 25 Oct.</text></g></svg>
