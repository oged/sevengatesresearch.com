<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc">
  <title id="title">Two clocks over Hormuz</title>
  <desc id="desc">A factual diagram compares Iran's proposed seven-day path to reopen Hormuz with a report that US bombing could resume after the November midterm elections. A transmission strip connects Hormuz to oil, Nigerian fuel and foreign exchange, inflation, and interest rates.</desc>
  <rect width="800" height="760" fill="#172521"/>
  <rect x="24" y="24" width="752" height="712" rx="5" fill="#F4F0E6"/>

  <text x="58" y="72" fill="#8A7042" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">THE HORMUZ CLOCK</text>
  <text x="58" y="121" fill="#172521" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="700">Two timetables, one strait</text>
  <text x="58" y="155" fill="#46524E" font-family="Arial, Helvetica, sans-serif" font-size="17">Diplomacy is counting days. Military planning is counting elections.</text>

  <g transform="translate(58 198)">
    <rect width="328" height="228" rx="4" fill="#E7E0D2" stroke="#B19A6C" stroke-width="1.5"/>
    <text x="24" y="39" fill="#6F5A35" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">IRAN’S PROPOSAL</text>
    <text x="24" y="107" fill="#172521" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700">7 days</text>
    <text x="24" y="141" fill="#172521" font-family="Arial, Helvetica, sans-serif" font-size="16">to restore normal Hormuz passage</text>
    <line x1="24" y1="168" x2="304" y2="168" stroke="#B19A6C"/>
    <circle cx="37" cy="198" r="6" fill="#496B57"/>
    <text x="54" y="204" fill="#46524E" font-family="Arial, Helvetica, sans-serif" font-size="14">Conditional reopening</text>
  </g>

  <g transform="translate(414 198)">
    <rect width="328" height="228" rx="4" fill="#172521"/>
    <text x="24" y="39" fill="#D7C89F" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">US TIMETABLE · REPORTED</text>
    <text x="24" y="82" fill="#F4F0E6" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">After the</text>
    <text x="24" y="120" fill="#F4F0E6" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">November</text>
    <text x="24" y="158" fill="#F4F0E6" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">midterms</text>
    <line x1="24" y1="174" x2="304" y2="174" stroke="#8A7042"/>
    <circle cx="37" cy="198" r="6" fill="#8F3E37"/>
    <text x="54" y="204" fill="#D8D2C5" font-family="Arial, Helvetica, sans-serif" font-size="14">Renewed bombing expected</text>
  </g>

  <text x="58" y="462" fill="#6F5A35" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">WSJ REPORT; REUTERS COULD NOT INDEPENDENTLY CONFIRM THE US TIMING</text>

  <g transform="translate(58 500)">
    <rect width="684" height="148" rx="4" fill="#172521"/>
    <text x="24" y="34" fill="#D7C89F" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">NIGERIA TRANSMISSION</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      <rect x="24" y="58" width="118" height="48" rx="3" fill="#F4F0E6"/>
      <text x="83" y="88" fill="#172521">HORMUZ</text>
      <path d="M150 82 H180" stroke="#B19A6C" stroke-width="2"/><path d="M180 82 l-10 -7 m10 7 l-10 7" fill="none" stroke="#B19A6C" stroke-width="2"/>
      <rect x="188" y="58" width="118" height="48" rx="3" fill="#F4F0E6"/>
      <text x="247" y="88" fill="#172521">OIL</text>
      <path d="M314 82 H344" stroke="#B19A6C" stroke-width="2"/><path d="M344 82 l-10 -7 m10 7 l-10 7" fill="none" stroke="#B19A6C" stroke-width="2"/>
      <rect x="352" y="58" width="142" height="48" rx="3" fill="#F4F0E6"/>
      <text x="423" y="79" fill="#172521">FUEL · FX</text>
      <text x="423" y="97" fill="#172521">TRANSPORT</text>
      <path d="M502 82 H532" stroke="#B19A6C" stroke-width="2"/><path d="M532 82 l-10 -7 m10 7 l-10 7" fill="none" stroke="#B19A6C" stroke-width="2"/>
      <rect x="540" y="58" width="120" height="48" rx="3" fill="#F4F0E6"/>
      <text x="600" y="79" fill="#172521">INFLATION</text>
      <text x="600" y="97" fill="#172521">· RATES</text>
    </g>
    <text x="24" y="132" fill="#D8D2C5" font-family="Arial, Helvetica, sans-serif" font-size="13">Export receipts rise through one channel. Household costs rise through several.</text>
  </g>

  <text x="58" y="687" fill="#46524E" font-family="Arial, Helvetica, sans-serif" font-size="13">Timelines are not a common scale. Arrows show transmission, not measured magnitude.</text>
  <text x="58" y="716" fill="#6F5A35" font-family="Arial, Helvetica, sans-serif" font-size="12">REUTERS AND OPENAI · 25–26 SEP 2026 · SEVEN GATES ANALYSIS</text>
</svg>
