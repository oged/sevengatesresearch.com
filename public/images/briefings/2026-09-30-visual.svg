<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc">
  <title id="title">September's two market ledgers</title>
  <desc id="desc">A factual dashboard compares sharply higher US Treasury yields and a stronger dollar with resilient Asian equities. The US 10-year yield is 5.2383 percent after rising nearly 50 basis points in September, the two-year yield is 4.8889 percent after rising more than 50 basis points, the dollar is up 2 percent, Asia excluding Japan is down just over 1 percent, Japan is roughly flat, South Korea is up 1.4 percent, and Brent crude is 103.16 dollars a barrel.</desc>
  <rect width="800" height="760" fill="#172521"/>
  <rect x="24" y="24" width="752" height="712" rx="5" fill="#F4F0E6"/>

  <text x="58" y="72" fill="#8A7042" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">SEPTEMBER 2026 · MARKET SCORECARD</text>
  <text x="58" y="121" fill="#172521" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="700">Two ledgers, one warning</text>
  <text x="58" y="155" fill="#46524E" font-family="Arial, Helvetica, sans-serif" font-size="17">The price of money rose. Risk assets barely blinked.</text>

  <g transform="translate(58 195)">
    <rect width="324" height="350" rx="5" fill="#172521"/>
    <text x="24" y="40" fill="#D7C89F" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">THE PRICE OF MONEY</text>

    <text x="24" y="91" fill="#F4F0E6" font-family="Arial, Helvetica, sans-serif" font-size="14">US 10-YEAR YIELD</text>
    <text x="24" y="130" fill="#F4F0E6" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">5.2383%</text>
    <text x="226" y="128" fill="#C86B5A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">+~50 bp</text>

    <line x1="24" y1="156" x2="300" y2="156" stroke="#40514C"/>
    <text x="24" y="199" fill="#F4F0E6" font-family="Arial, Helvetica, sans-serif" font-size="14">US 2-YEAR YIELD</text>
    <text x="24" y="238" fill="#F4F0E6" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">4.8889%</text>
    <text x="226" y="236" fill="#C86B5A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">+&gt;50 bp</text>

    <line x1="24" y1="264" x2="300" y2="264" stroke="#40514C"/>
    <text x="24" y="307" fill="#F4F0E6" font-family="Arial, Helvetica, sans-serif" font-size="14">US DOLLAR</text>
    <text x="228" y="309" fill="#C86B5A" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">+2.0%</text>
  </g>

  <g transform="translate(418 195)">
    <rect width="324" height="350" rx="5" fill="#E5DFD2" stroke="#B9A778" stroke-width="1"/>
    <text x="24" y="40" fill="#6F5A35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">THE PRICE OF OPTIMISM</text>

    <text x="24" y="91" fill="#172521" font-family="Arial, Helvetica, sans-serif" font-size="14">ASIA EX-JAPAN</text>
    <rect x="24" y="110" width="190" height="14" rx="7" fill="#C9C1B4"/>
    <rect x="24" y="110" width="66" height="14" rx="7" fill="#B65E53"/>
    <text x="228" y="126" fill="#8A3E37" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700">&gt;−1%</text>

    <line x1="24" y1="156" x2="300" y2="156" stroke="#C9C1B4"/>
    <text x="24" y="199" fill="#172521" font-family="Arial, Helvetica, sans-serif" font-size="14">JAPAN NIKKEI</text>
    <rect x="24" y="218" width="190" height="14" rx="7" fill="#C9C1B4"/>
    <rect x="112" y="218" width="8" height="14" rx="4" fill="#8A7042"/>
    <text x="228" y="234" fill="#6F5A35" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700">~0%</text>

    <line x1="24" y1="264" x2="300" y2="264" stroke="#C9C1B4"/>
    <text x="24" y="307" fill="#172521" font-family="Arial, Helvetica, sans-serif" font-size="14">SOUTH KOREA KOSPI</text>
    <text x="228" y="309" fill="#3D6D58" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700">+1.4%</text>
  </g>

  <g transform="translate(58 575)">
    <rect width="684" height="84" rx="4" fill="#8A7042"/>
    <text x="24" y="31" fill="#F4F0E6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.3">THE ENERGY INPUT</text>
    <text x="24" y="65" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">BRENT  $103.16 / BARREL</text>
    <text x="462" y="64" fill="#F4F0E6" font-family="Arial, Helvetica, sans-serif" font-size="14">Inflation stays in the room</text>
  </g>

  <text x="58" y="696" fill="#172521" font-family="Arial, Helvetica, sans-serif" font-size="14">Higher discount rates have not yet produced a matching equity correction.</text>
  <text x="58" y="716" fill="#6F5A35" font-family="Arial, Helvetica, sans-serif" font-size="12">REUTERS MARKET DATA · 30 SEP 2026 · MONTHLY CHANGES APPROXIMATE</text>
</svg>
