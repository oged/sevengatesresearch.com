<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">THE SHOCK PATH</title>
<desc id="desc">A four-stage transmission board showing low Strait of Hormuz traffic, Brent crude at $95.52 a barrel, Nigerian depot petrol prices up to ₦1,290 per litre and NNPC Lagos pump prices at ₦1,299 per litre.</desc>
<style>
  .eyebrow{font:700 18px Arial,sans-serif;letter-spacing:3px;fill:#B08A3E}
  .title{font:700 50px Georgia,serif;fill:#0B1F33}
  .subtitle{font:400 24px Arial,sans-serif;fill:#64707B}
  .label{font:700 14px Arial,sans-serif;letter-spacing:1px;fill:#B08A3E}
  .lead{font:400 16px Arial,sans-serif;fill:#64707B}
  .value{font:700 30px Georgia,serif;fill:#0B1F33}
  .unit{font:400 22px Georgia,serif;fill:#0B1F33}
  .detail{font:400 20px Arial,sans-serif;fill:#0B1F33}
  .source{font:400 15px Arial,sans-serif;fill:#64707B}
</style>

<!-- Background + top rule -->
<rect width="1400" height="760" fill="#F5F0E6"/>
<rect x="0" y="0" width="1400" height="14" fill="#0B1F33"/>

<!-- Header block -->
<text x="55" y="72" class="eyebrow">SEVEN GATES RESEARCH · VISUAL OF THE DAY</text>
<text x="55" y="142" class="title">THE SHOCK PATH</text>
<text x="55" y="190" class="subtitle">How Gulf insecurity is moving from the shipping lane to Nigeria&#8217;s forecourts</text>

<!-- Card 1: STRAIT OF HORMUZ TRAFFIC (active, gold border) -->
<rect x="55" y="270" width="290" height="300" rx="18" fill="#FFFFFF" stroke="#B08A3E" stroke-width="4"/>
<text x="79" y="318" class="label">STRAIT OF HORMUZ TRAFFIC</text>
<text x="79" y="385" class="value">Still low</text>
<text x="79" y="440" class="detail">Commercial shipping remained</text>
<text x="79" y="466" class="detail">subdued after renewed US and</text>
<text x="79" y="492" class="detail">Iranian attacks.</text>

<!-- Arrow 1 -->
<path d="M 355 420 L 380 420" stroke="#B08A3E" stroke-width="4"/>
<path d="M 375 411 L 385 420 L 375 429" fill="none" stroke="#B08A3E" stroke-width="4"/>

<!-- Card 2: BRENT CRUDE -->
<rect x="388" y="270" width="290" height="300" rx="18" fill="#FFFFFF" stroke="#EDE4D3" stroke-width="2"/>
<text x="412" y="318" class="label">BRENT CRUDE</text>
<text x="412" y="385" class="value">$95.52<tspan class="unit"> /bbl</tspan></text>
<text x="412" y="440" class="detail">The benchmark was heading</text>
<text x="412" y="466" class="detail">for a 7.6% weekly rise.</text>

<!-- Arrow 2 -->
<path d="M 688 420 L 713 420" stroke="#B08A3E" stroke-width="4"/>
<path d="M 708 411 L 718 420 L 708 429" fill="none" stroke="#B08A3E" stroke-width="4"/>

<!-- Card 3: NIGERIA DEPOT PETROL -->
<rect x="721" y="270" width="290" height="300" rx="18" fill="#FFFFFF" stroke="#EDE4D3" stroke-width="2"/>
<text x="745" y="318" class="label">NIGERIA DEPOT PETROL</text>
<text x="745" y="352" class="lead">Up to</text>
<text x="745" y="385" class="value">&#8358;1,290<tspan class="unit"> /litre</tspan></text>
<text x="745" y="440" class="detail">Prices rose across Lagos,</text>
<text x="745" y="466" class="detail">Calabar, Port Harcourt</text>
<text x="745" y="492" class="detail">and Warri hubs.</text>

<!-- Arrow 3 -->
<path d="M 1021 420 L 1046 420" stroke="#B08A3E" stroke-width="4"/>
<path d="M 1041 411 L 1051 420 L 1041 429" fill="none" stroke="#B08A3E" stroke-width="4"/>

<!-- Card 4: NNPC LAGOS PUMP PRICE -->
<rect x="1054" y="270" width="290" height="300" rx="18" fill="#FFFFFF" stroke="#EDE4D3" stroke-width="2"/>
<text x="1078" y="318" class="label">NNPC LAGOS PUMP PRICE</text>
<text x="1078" y="385" class="value">&#8358;1,299<tspan class="unit"> /litre</tspan></text>
<text x="1078" y="440" class="detail">Reported retail price</text>
<text x="1078" y="466" class="detail">following repeated refinery</text>
<text x="1078" y="492" class="detail">and depot adjustments.</text>

<!-- Footer rule + source -->
<line x1="55" y1="690" x2="1345" y2="690" stroke="#EDE4D3" stroke-width="2"/>
<text x="55" y="724" class="source">Sources: Reuters · Associated Press · Vanguard · Legit.ng. Seven Gates Research, 2026-09-04.</text>
</svg>
