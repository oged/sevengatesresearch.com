<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="FCMB 2007 public offer and 2026 share price editorial illustration"><rect width="1600" height="900" fill="#FBF8F1"/><rect width="800" height="900" fill="#F4F0E8"/><rect x="800" width="800" height="900" fill="#1A1F24"/><text x="90" y="85" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#A67C3D">SEVEN GATES RESEARCH · EDITORIAL ILLUSTRATION</text><text x="90" y="170" font-family="Georgia,serif" font-size="64" font-weight="700" fill="#1A1F24">2007</text><text x="90" y="230" font-family="Arial,sans-serif" font-size="23" fill="#46504F">PUBLIC OFFER</text><rect x="90" y="285" width="610" height="360" fill="#FBF8F1" stroke="#C6BFAE" stroke-width="3"/><text x="135" y="345" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#46504F">FIRST CITY MONUMENT BANK PLC</text><text x="135" y="420" font-family="Georgia,serif" font-size="34" fill="#1A1F24">Offer for subscription of</text><text x="135" y="495" font-family="Georgia,serif" font-size="55" font-weight="700" fill="#1A1F24">4,500,000,000</text><text x="135" y="545" font-family="Arial,sans-serif" font-size="19" fill="#46504F">ordinary shares</text><text x="135" y="610" font-family="Georgia,serif" font-size="46" font-weight="700" fill="#A67C3D">₦14.00 per share</text><text x="90" y="725" font-family="Georgia,serif" font-size="30" font-style="italic" fill="#46504F">“My Bank and I invite YOU to INVEST!”</text><text x="875" y="170" font-family="Georgia,serif" font-size="64" font-weight="700" fill="#FBF8F1">2026</text><text x="875" y="230" font-family="Arial,sans-serif" font-size="23" fill="#C6BFAE">4 SEPTEMBER CLOSE</text><text x="875" y="390" font-family="Arial,sans-serif" font-size="18" fill="#C6BFAE">FCMB</text><text x="875" y="505" font-family="Georgia,serif" font-size="100" font-weight="700" fill="#A67C3D">₦11.90</text><line x1="875" y1="555" x2="1480" y2="555" stroke="#A67C3D" stroke-width="2"/><text x="875" y="620" font-family="Arial,sans-serif" font-size="24" fill="#FBF8F1">65.95bn shares outstanding</text><text x="875" y="665" font-family="Arial,sans-serif" font-size="24" fill="#FBF8F1">₦784.9bn market capitalisation</text><text x="875" y="750" font-family="Georgia,serif" font-size="35" font-weight="700" fill="#FBF8F1">The old shareholder bought hope.</text><text x="875" y="800" font-family="Georgia,serif" font-size="35" font-weight="700" fill="#A67C3D">The new one may be buying memory.</text></svg>