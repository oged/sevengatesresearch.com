<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NGX Group as the shovel seller at Nigeria's capital-market gold rush</title>
  <desc id="desc">Editorial illustration of a Nigerian market merchant behind a row of brass shovels labelled listings, trading, data, indices, clearing and settlement, while prospectors dig toward IPO and Frontier Market signs in the distance.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13202c"/><stop offset="0.58" stop-color="#7f4c28"/><stop offset="1" stop-color="#d5a15d"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f5134"/><stop offset="1" stop-color="#241b17"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E0B268"/><stop offset="0.48" stop-color="#A67C3D"/><stop offset="1" stop-color="#6c4b22"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#FBF8F1"/>
  <rect x="24" y="24" width="1552" height="852" rx="6" fill="url(#sky)" stroke="#A67C3D" stroke-width="3"/>
  <circle cx="1310" cy="225" r="78" fill="#f6d38f" opacity=".9"/>
  <path d="M24 590 C260 510 440 550 650 500 C890 445 1070 500 1250 455 C1400 420 1510 440 1576 455 L1576 876 L24 876 Z" fill="url(#ground)"/>

