<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F6F1E4"/><rect x="30" y="25" width="1540" height="850" rx="8" fill="none" stroke="#26342B" stroke-width="2"/><text x="70" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#A67C3D" letter-spacing="3">FIGURE 4</text><text x="70" y="135" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#1F1B15">The diversification problem got richer, not smaller.</text><text x="70" y="172" font-family="Arial,sans-serif" font-size="18" fill="#5E584F">Transaction fees as a share of NGX Group revenue.</text><text x="330" y="375" text-anchor="end" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1F1B15">H1 2025</text><rect x="380" y="340" width="850" height="50" rx="5" fill="#E5E0D6"/><rect x="380" y="340" width="521.9" height="50" rx="5" fill="#A67C3D"/><text x="931.9" y="375" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1F1B15">61.4%</text><text x="330" y="525" text-anchor="end" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1F1B15">H1 2026</text><rect x="380" y="490" width="850" height="50" rx="5" fill="#E5E0D6"/><rect x="380" y="490" width="644.3" height="50" rx="5" fill="#A67C3D"/><text x="1054.3" y="525" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1F1B15">75.8%</text><text x="380" y="665" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#1F1B15">2017 identified the problem. 2026 has not solved it; it has made the problem more profitable.</text><text x="70" y="825" font-family="Arial,sans-serif" font-size="14" fill="#5E584F">Sources: NGX Group H1 2026 earnings release; Proshare Research.</text><text x="70" y="850" font-family="Arial,sans-serif" font-size="13" fill="#5E584F">Transaction fees rose 169% to ₦13.34bn in H1 2026.</text></svg>