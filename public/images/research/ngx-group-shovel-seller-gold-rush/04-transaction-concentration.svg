<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FBF8F1"/><rect x="36" y="36" width="1528" height="828" rx="8" fill="none" stroke="#1A1F24" stroke-width="3"/>
<text x="88" y="102" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#A67C3D" letter-spacing="3">FIGURE 3</text>
<text x="88" y="158" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#1A1F24">The diversification problem got richer, not smaller.</text>
<text x="88" y="198" font-family="Arial,sans-serif" font-size="20" fill="#5B625F">Transaction fees as a share of NGX Group revenue.</text><text x="170" y="382" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1F24">H1 2025</text><rect x="360" y="350" width="1000" height="60" rx="6" fill="#C6BFAE" opacity=".35"/><rect x="360" y="350" width="614.0" height="60" rx="6" fill="#A67C3D"/><text x="1004" y="389" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1A1F24">61.4%</text><text x="170" y="562" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1F24">H1 2026</text><rect x="360" y="530" width="1000" height="60" rx="6" fill="#C6BFAE" opacity=".35"/><rect x="360" y="530" width="758.0" height="60" rx="6" fill="#A67C3D"/><text x="1148" y="569" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1A1F24">75.8%</text><text x="360" y="665" font-family="Georgia,serif" font-size="24" font-style="italic" fill="#1A1F24">2017 identified the problem. 2026 has not solved it; it has made the problem more profitable.</text><text x="88" y="820" font-family="Arial,sans-serif" font-size="15" fill="#5B625F">Source: NGX Group H1 2026 earnings release; Proshare Research.</text><text x="88" y="846" font-family="Arial,sans-serif" font-size="14" fill="#5B625F">Transaction fees rose 169% to ₦13.34bn in H1 2026.</text></svg>