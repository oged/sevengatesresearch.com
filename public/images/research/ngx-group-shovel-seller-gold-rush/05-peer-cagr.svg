<text x="88" y="198" font-family="Arial,sans-serif" font-size="20" fill="#5B625F">Approximate ten-year price CAGR, Sep 2016 to Sep 2026. Price only; dividends excluded.</text><text x="170" y="344" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1F24">CME</text><rect x="320" y="310" width="1000" height="54" rx="4" fill="#C6BFAE" opacity=".3"/><rect x="320" y="310" width="396.0" height="54" rx="4" fill="#A67C3D"/><text x="746.0" y="346" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1A1F24">9.9%</text><text x="170" y="449" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1F24">ICE</text><rect x="320" y="415" width="1000" height="54" rx="4" fill="#C6BFAE" opacity=".3"/><rect x="320" y="415" width="436.0" height="54" rx="4" fill="#A67C3D"/><text x="786.0" y="451" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1A1F24">10.9%</text><text x="170" y="554" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1F24">LSEG</text><rect x="320" y="520" width="1000" height="54" rx="4" fill="#C6BFAE" opacity=".3"/><rect x="320" y="520" width="464.0" height="54" rx="4" fill="#A67C3D"/><text x="814.0" y="556" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1A1F24">11.6%</text><text x="170" y="659" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1F24">FICO</text><rect x="320" y="625" width="1000" height="54" rx="4" fill="#C6BFAE" opacity=".3"/><rect x="320" y="625" width="904.0" height="54" rx="4" fill="#A67C3D"/><text x="1254.0" y="661" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1A1F24">22.6%</text><text x="170" y="755" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#1A1F24">Liquidity, data, indices and embedded standards compounded better than a prettier trading screen.</text><text x="88" y="820" font-family="Arial,sans-serif" font-size="15" fill="#5B625F">Source: Seven Gates calculations from public historical prices for CME, ICE, LSEG and FICO.</text><text x="88" y="846" font-family="Arial,sans-serif" font-size="14" fill="#5B625F">FICO is a business-model analogue, not an exchange peer. Dividends excluded, so exchange shareholder returns are understated.</text></svg>