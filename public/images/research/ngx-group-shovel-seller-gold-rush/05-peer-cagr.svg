<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F6F1E4"/><rect x="30" y="25" width="1540" height="850" rx="8" fill="none" stroke="#26342B" stroke-width="2"/><text x="70" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#A67C3D" letter-spacing="3">FIGURE 5</text><text x="70" y="135" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#1F1B15">The winners moved deeper into the workflow.</text><text x="70" y="172" font-family="Arial,sans-serif" font-size="18" fill="#5E584F">Approximate ten-year price CAGR, Sep 2016 to Sep 2026. Price only; dividends excluded.</text><text x="260" y="320" text-anchor="end" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1F1B15">CME</text><rect x="310" y="286" width="850" height="48" rx="4" fill="#E5E0D6"/><rect x="310" y="286" width="336.6" height="48" rx="4" fill="#A67C3D"/><text x="671.6" y="320" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1B15">9.9%</text><text x="260" y="430" text-anchor="end" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1F1B15">ICE</text><rect x="310" y="396" width="850" height="48" rx="4" fill="#E5E0D6"/><rect x="310" y="396" width="370.6" height="48" rx="4" fill="#A67C3D"/><text x="705.6" y="430" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1B15">10.9%</text><text x="260" y="540" text-anchor="end" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1F1B15">LSEG</text><rect x="310" y="506" width="850" height="48" rx="4" fill="#E5E0D6"/><rect x="310" y="506" width="394.4" height="48" rx="4" fill="#A67C3D"/><text x="729.4" y="540" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1B15">11.6%</text><text x="260" y="650" text-anchor="end" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1F1B15">FICO</text><rect x="310" y="616" width="850" height="48" rx="4" fill="#E5E0D6"/><rect x="310" y="616" width="768.4" height="48" rx="4" fill="#A67C3D"/><text x="1103.4" y="650" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1F1B15">22.6%</text><text x="310" y="760" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#1F1B15">Liquidity, data, indices and embedded standards compounded better than a prettier trading screen.</text><text x="70" y="825" font-family="Arial,sans-serif" font-size="14" fill="#5E584F">Sources: Seven Gates calculations from public historical prices for CME, ICE, LSEG and FICO.</text><text x="70" y="850" font-family="Arial,sans-serif" font-size="13" fill="#5E584F">FICO is a business-model analogue, not an exchange peer. Dividends excluded; exchange shareholder returns are understated.</text></svg>