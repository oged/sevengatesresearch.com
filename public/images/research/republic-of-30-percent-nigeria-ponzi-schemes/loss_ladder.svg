<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#FBF8F1"/><text x="60" y="60" font-family="Arial" font-size="17" font-weight="700" fill="#A67C3D">FIGURE 6</text><text x="60" y="105" font-family="Georgia" font-size="33" font-weight="700" fill="#1A1F24">Nigeria's Ponzi-loss total is a ladder of evidence.</text><text x="60" y="135" font-family="Arial" font-size="16" fill="#46504F">Higher headline numbers often come with lower measurement confidence</text><rect x="170" y="190" width="860" height="58" rx="8" fill="none" stroke="#1A1F24" stroke-width="4"/><text x="600" y="227" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#1A1F24">DOCUMENTED / OFFICIAL</text><rect x="205" y="275" width="790" height="58" rx="8" fill="none" stroke="#A67C3D" stroke-width="4"/><text x="600" y="312" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#A67C3D">COURT ALLEGATIONS</text><rect x="240" y="360" width="720" height="58" rx="8" fill="none" stroke="#46504F" stroke-width="4"/><text x="600" y="397" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#46504F">INVESTOR CLAIMS</text><rect x="275" y="445" width="650" height="58" rx="8" fill="none" stroke="#46160F" stroke-width="4"/><text x="600" y="482" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#46160F">MEDIA ESTIMATES</text><rect x="310" y="530" width="580" height="58" rx="8" fill="none" stroke="#8A3B2D" stroke-width="4"/><text x="600" y="567" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#8A3B2D">UNKNOWN / UNREPORTED</text><text x="60" y="665" font-family="Arial" font-size="13" fill="#46504F">Categories overlap. They must not be added mechanically.</text></svg>