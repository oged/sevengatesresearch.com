<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><rect width="1200" height="700" fill="#FBF8F1"/><text x="48" y="44" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#A67C3D">FIGURE 7</text><text x="48" y="88" font-family="Georgia, 'EB Garamond', serif" font-size="32" font-weight="700" fill="#1A1F24">Nigeria's Ponzi-loss total is a ladder of evidence, not one clean number.</text><text x="48" y="118" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46504F">Higher rungs are firmer evidence; lower rungs are wider claims with lower confidence</text><line x1="48" y1="134" x2="1152" y2="134" stroke="#C6BFAE" stroke-width="1.5"/><rect x="80" y="165" width="1040" height="78" rx="6" fill="#F4F0E8" stroke="#1A1F24" stroke-width="3"/><text x="110" y="199" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#1A1F24" text-anchor="start" font-weight="700" >Documented / official</text><text x="110" y="225" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#46504F" text-anchor="start" font-weight="400" >NDIC (2017): about three million people, about ₦18bn put into MMM</text><text x="1090" y="211" font-family="Arial, Helvetica, sans-serif" font-size="1" fill="#1A1F24" text-anchor="start" font-weight="400" ></text><rect x="80" y="263" width="1040" height="78" rx="6" fill="#F4F0E8" stroke="#A67C3D" stroke-width="3"/><text x="110" y="297" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#A67C3D" text-anchor="start" font-weight="700" >Court allegations</text><text x="110" y="323" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#46504F" text-anchor="start" font-weight="400" >Ovaioza charges: about ₦408m identified; CBEX proceedings: alleged $1bn scale</text><text x="1090" y="309" font-family="Arial, Helvetica, sans-serif" font-size="1" fill="#1A1F24" text-anchor="start" font-weight="400" ></text><rect x="80" y="361" width="1040" height="78" rx="6" fill="#F4F0E8" stroke="#46504F" stroke-width="3"/><text x="110" y="395" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#46504F" text-anchor="start" font-weight="700" >Investor claims</text><text x="110" y="421" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#46504F" text-anchor="start" font-weight="400" >MBA Forex victims: figures well above ₦100bn, some above ₦200bn</text><text x="1090" y="407" font-family="Arial, Helvetica, sans-serif" font-size="1" fill="#1A1F24" text-anchor="start" font-weight="400" ></text><rect x="80" y="459" width="1040" height="78" rx="6" fill="#F4F0E8" stroke="#8A3B2D" stroke-width="3"/><text x="110" y="493" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#8A3B2D" text-anchor="start" font-weight="700" >Media estimates</text><text x="110" y="519" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#46504F" text-anchor="start" font-weight="400" >CBEX: ₦1.3 trillion, reported, not audited</text><text x="1090" y="505" font-family="Arial, Helvetica, sans-serif" font-size="1" fill="#1A1F24" text-anchor="start" font-weight="400" ></text><rect x="80" y="557" width="1040" height="78" rx="6" fill="#F4F0E8" stroke="#6B2A20" stroke-width="3"/><text x="110" y="591" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#6B2A20" text-anchor="start" font-weight="700" >Unknown / unreported</text><text x="110" y="617" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#46504F" text-anchor="start" font-weight="400" >Shame, cash transactions, informal recruitment, incomplete records</text><text x="1090" y="603" font-family="Arial, Helvetica, sans-serif" font-size="1" fill="#1A1F24" text-anchor="start" font-weight="400" ></text><text x="48" y="678" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#46504F">Source: Seven Gates evidence taxonomy. Categories overlap; do not add them mechanically.</text></svg>