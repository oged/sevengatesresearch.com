<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Queue outside a fictional Nigerian investment office promising 30 percent monthly returns</title>
<desc id="desc">Seven Gates black-and-white editorial illustration showing a long queue entering a fictional investment office in Lagos beneath a large sign promising 30 percent monthly returns.</desc>
<defs>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#1A1F24" stroke-opacity=".13" stroke-width="1"/>
  </pattern>
  <pattern id="cross" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M0 10L10 0M-2 2L2-2M8 12L12 8" stroke="#1A1F24" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="17" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="fade"><feFuncA type="table" tableValues="0 .06"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="fade" mode="multiply"/>
  </filter>
</defs>

