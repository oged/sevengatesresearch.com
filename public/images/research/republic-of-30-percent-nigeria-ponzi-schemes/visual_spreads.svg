f" font-size="20" fill="#1A1F24" text-anchor="start" font-weight="700" >Paid early winner, screenshot in hand</text><text x="900" y="330" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46504F" text-anchor="start" font-weight="400" >Family, colleague, pastor,</text><text x="900" y="358" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46504F" text-anchor="start" font-weight="400" >alumni chairman,</text><text x="900" y="386" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46504F" text-anchor="start" font-weight="400" >WhatsApp administrator</text><text x="600" y="590" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#A67C3D" text-anchor="middle" font-weight="700" >Trust  ·  Proximity  ·  Referral pressure</text><text x="600" y="616" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#46504F" text-anchor="middle" font-weight="400" >None of these three is evidence of where the return comes from.</text><text x="48" y="678" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#46504F">Source: Seven Gates conceptual illustration.</text></svg>