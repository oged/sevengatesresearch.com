  <text x="32" y="70" font-family="Arial,sans-serif" font-size="16" fill="#46504F">☑ crack spreads   ☑ demand outlook   ☑ 207 pages   ☑ ask again: what if?</text>
  <text x="32" y="96" font-family="Arial,sans-serif" font-size="15" fill="#A67C3D">Caffeine supplied the chemistry. The prospectus supplied the argument.</text>
