<!-- quote panel -->
<g transform="translate(1240,55)">
  <text x="0" y="40" font-family="Georgia,serif" font-style="italic" font-size="28" fill="#1A1F24">“When the facts change,</text>
  <text x="35" y="78" font-family="Georgia,serif" font-style="italic" font-size="28" fill="#1A1F24">I change my mind.</text>
  <text x="46" y="116" font-family="Georgia,serif" font-style="italic" font-size="28" fill="#1A1F24">What do you do, sir?”</text>
  <line x1="130" y1="142" x2="210" y2="142" stroke="#A67C3D" stroke-width="4"/>
</g>
