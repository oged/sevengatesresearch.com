<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Dangote Refinery IPO valuation: the elephant in the research room</title>
<desc id="desc">Seven Gates editorial illustration of an elephant in a refinery control room, three valuation cards, analysts, coffee, crack-spread notes and the Keynes quote.</desc>
