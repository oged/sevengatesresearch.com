<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-label="H1 2026 revenue and PAT growth comparison"><rect width="1200" height="650" fill="#f7f1e5"/><text x="70" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14213d">Same traffic. Opposite profit outcome.</text><text x="70" y="108" font-family="Arial,sans-serif" font-size="19" fill="#5d6470">H1 2026 year-on-year growth</text><line x1="90" y1="360" x2="1130" y2="360" stroke="#9ca3af" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#14213d"><text x="260" y="605">SAHCO revenue</text><text x="490" y="605">NAHCO revenue</text><text x="750" y="605">SAHCO PAT</text><text x="980" y="605">NAHCO PAT</text></g><rect x="190" y="305" width="140" height="55" rx="4" fill="#b58a3b"/><rect x="420" y="304" width="140" height="56" rx="4" fill="#b58a3b"/><rect x="680" y="360" width="140" height="210" rx="4" fill="#8f3f36"/><rect x="910" y="228" width="140" height="132" rx="4" fill="#1f6b55"/><g font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle"><text x="260" y="290" fill="#14213d">+9.3%</text><text x="490" y="289" fill="#14213d">+9.4%</text><text x="750" y="555" fill="#fff">−52.7%</text><text x="980" y="212" fill="#14213d">+22.2%</text></g><text x="70" y="635" font-family="Arial,sans-serif" font-size="15" fill="#6b7280">Source: SAHCO and NAHCO H1 2026 filings; Seven Gates calculations.</text></svg>