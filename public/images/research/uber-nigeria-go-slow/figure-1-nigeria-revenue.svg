<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Uber Nigeria estimated platform revenue, 2014-2025</title>
<desc id="desc">Line chart showing the Seven Gates shadow reconstruction of Uber Nigeria's estimated nominal platform revenue in Nigerian naira from launch in 2014 to approximately 12.6 billion naira in 2025, with a pandemic dip visible in 2020 and rapid acceleration from 2022 driven by naira depreciation and volume growth.</desc>
<style>
  .eyebrow{font:700 15px Arial,sans-serif;letter-spacing:2.5px;fill:#B08A3E}
  .title{font:700 32px Georgia,serif;fill:#0B1F33}
  .subtitle{font:400 18px Arial,sans-serif;fill:#64707B}
  .axis{font:400 14px Arial,sans-serif;fill:#64707B}
  .markerLabel{font:700 18px Georgia,serif;fill:#0B1F33}
  .annotation{font:400 13px Arial,sans-serif;fill:#64707B;font-style:italic}
  .source{font:400 12px Arial,sans-serif;fill:#64707B}
</style>

<rect width="1400" height="600" fill="#F5F0E6"/>
<rect x="0" y="0" width="1400" height="10" fill="#0B1F33"/>

<text x="55" y="52" class="eyebrow">FIGURE 1 &#183; SEVEN GATES RESEARCH</text>
<text x="55" y="98" class="title">The naira revenue curve rose. The strategic value did not necessarily follow.</text>
<text x="55" y="128" class="subtitle">Seven Gates shadow reconstruction, 2014-2025. Not reported Uber Nigeria segment revenue.</text>

<!-- Chart plot area: x from 200 to 1345 (width 1145), y from 170 to 500 (height 330) -->
<!-- Y scale: 0 to 14 (billions NGN) -->
<!-- Y positions: 0 -> 500, 14 -> 170. Per 1bn = 23.57px -->

<!-- Y gridlines -->
<line x1="200" y1="500" x2="1345" y2="500" stroke="#0B1F33" stroke-width="1.5"/>
<line x1="200" y1="452.9" x2="1345" y2="452.9" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="405.7" x2="1345" y2="405.7" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="358.6" x2="1345" y2="358.6" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="311.4" x2="1345" y2="311.4" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="264.3" x2="1345" y2="264.3" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="217.1" x2="1345" y2="217.1" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="170" x2="1345" y2="170" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>

<!-- Y labels (NGN bn) -->
<text x="190" y="504" text-anchor="end" class="axis">0</text>
<text x="190" y="457" text-anchor="end" class="axis">2</text>
<text x="190" y="410" text-anchor="end" class="axis">4</text>
<text x="190" y="363" text-anchor="end" class="axis">6</text>
<text x="190" y="315" text-anchor="end" class="axis">8</text>
<text x="190" y="268" text-anchor="end" class="axis">10</text>
<text x="190" y="221" text-anchor="end" class="axis">12</text>
<text x="190" y="174" text-anchor="end" class="axis">14</text>

<!-- Y-axis title -->
<text x="60" y="335" class="axis" transform="rotate(-90 60 335)" text-anchor="middle">Estimated platform revenue (NGN bn)</text>

<!-- X axis year labels: 2014 to 2025, 11 year gaps. Width 1145. Per year = 104.1 px -->
<!-- x2014=200, x2015=304, x2016=408, x2017=513, x2018=617, x2019=721, x2020=825, x2021=929, x2022=1034, x2023=1138, x2024=1242, x2025=1346 -->
<!-- Adjust so 2025 fits: use 200 to 1330, span 1130, per year = 102.7. 2014=200, 2025=1330 -->

<text x="200" y="525" text-anchor="middle" class="axis">2014</text>
<text x="303" y="525" text-anchor="middle" class="axis">2015</text>
<text x="405" y="525" text-anchor="middle" class="axis">2016</text>
<text x="508" y="525" text-anchor="middle" class="axis">2017</text>
<text x="611" y="525" text-anchor="middle" class="axis">2018</text>
<text x="713" y="525" text-anchor="middle" class="axis">2019</text>
<text x="816" y="525" text-anchor="middle" class="axis">2020</text>
<text x="919" y="525" text-anchor="middle" class="axis">2021</text>
<text x="1021" y="525" text-anchor="middle" class="axis">2022</text>
<text x="1124" y="525" text-anchor="middle" class="axis">2023</text>
<text x="1227" y="525" text-anchor="middle" class="axis">2024</text>
<text x="1330" y="525" text-anchor="middle" class="axis">2025</text>

<!-- Reconstruction values (illustrative, NGN bn):
     2014: 0.05 -> y=500-0.05*23.57=498.8
     2015: 0.15 -> y=500-3.5=496.5
     2016: 0.35 -> y=500-8.25=491.7
     2017: 1.1 -> y=500-25.9=474.1
     2018: 1.55 -> y=500-36.5=463.5
     2019: 1.85 -> y=500-43.6=456.4
     2020: 0.95 (pandemic) -> y=500-22.4=477.6
     2021: 1.9 -> y=500-44.8=455.2
     2022: 3.0 -> y=500-70.7=429.3
     2023: 5.0 -> y=500-117.9=382.1
     2024: 9.5 -> y=500-223.9=276.1
     2025: 12.56 -> y=500-296.1=203.9 -->

<path d="M 200 498.8
         L 303 496.5
         L 405 491.7
         L 508 474.1
         L 611 463.5
         L 713 456.4
         L 816 477.6
         L 919 455.2
         L 1021 429.3
         L 1124 382.1
         L 1227 276.1
         L 1330 203.9"
      fill="none" stroke="#0B1F33" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

<!-- Shaded area beneath the line for emphasis -->
<path d="M 200 498.8
         L 303 496.5
         L 405 491.7
         L 508 474.1
         L 611 463.5
         L 713 456.4
         L 816 477.6
         L 919 455.2
         L 1021 429.3
         L 1124 382.1
         L 1227 276.1
         L 1330 203.9
         L 1330 500
         L 200 500 Z"
      fill="#B08A3E" fill-opacity="0.12"/>

<!-- 2025 anchor marker -->
<circle cx="1330" cy="203.9" r="7" fill="#B08A3E" stroke="#F5F0E6" stroke-width="2"/>
<text x="1320" y="190" text-anchor="end" class="markerLabel">NGN 12.6bn</text>

<!-- Pandemic annotation with a subtle pointer -->
<text x="816" y="497" text-anchor="middle" class="annotation">Pandemic</text>

<!-- Source -->
<line x1="55" y1="565" x2="1345" y2="565" stroke="#EDE4D3" stroke-width="1"/>
<text x="55" y="583" class="source">Source: Uber historical disclosures; Seven Gates reconstruction. Values are nominal NGN and estimates, not reported Nigeria segment revenue.</text>
</svg>
