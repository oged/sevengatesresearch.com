<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Uber share price anchor points, 2019 to 2026</title>
<desc id="desc">Bar chart comparing Uber's May 2019 IPO reference price of $45.00, its fifty-two-week high of $101.99 and its 1 September 2026 closing price of $75.24.</desc>
<style>
  .eyebrow{font:700 15px Arial,sans-serif;letter-spacing:2.5px;fill:#B08A3E}
  .title{font:700 32px Georgia,serif;fill:#0B1F33}
  .subtitle{font:400 18px Arial,sans-serif;fill:#64707B}
  .axis{font:400 14px Arial,sans-serif;fill:#64707B}
  .barLabel{font:700 26px Georgia,serif;fill:#0B1F33}
  .barCat{font:700 15px Arial,sans-serif;letter-spacing:.8px;text-transform:uppercase;fill:#0B1F33}
  .barCatSecond{font:400 13px Arial,sans-serif;fill:#64707B}
  .source{font:400 12px Arial,sans-serif;fill:#64707B}
</style>

<rect width="1400" height="600" fill="#F5F0E6"/>
<rect x="0" y="0" width="1400" height="10" fill="#0B1F33"/>

<text x="55" y="52" class="eyebrow">FIGURE 3 &#183; SEVEN GATES RESEARCH</text>
<text x="55" y="98" class="title">Uber was not retreating from Nigeria because the parent was running out of money</text>
<text x="55" y="128" class="subtitle">Reference price points used in the September 2026 essay.</text>

<!-- Chart plot area: y from 170 (top) to 500 (bottom), height 330 -->
<!-- Y scale: 0 to 120, so $ maps to y=500 - (val/120)*330 -->
<!-- $45.00 -> y=500 - (45/120)*330 = 500 - 123.75 = 376.25 (bar height 123.75)
     $101.99 -> y=500 - (101.99/120)*330 = 500 - 280.5 = 219.5 (bar height 280.5)
     $75.24 -> y=500 - (75.24/120)*330 = 500 - 207 = 293 (bar height 207) -->

<!-- Y gridlines -->
<line x1="240" y1="500" x2="1345" y2="500" stroke="#0B1F33" stroke-width="1.5"/>
<line x1="240" y1="445" x2="1345" y2="445" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="240" y1="390" x2="1345" y2="390" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="240" y1="335" x2="1345" y2="335" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="240" y1="280" x2="1345" y2="280" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="240" y1="225" x2="1345" y2="225" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="240" y1="170" x2="1345" y2="170" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>

<!-- Y labels ($USD) -->
<text x="230" y="504" text-anchor="end" class="axis">$0</text>
<text x="230" y="449" text-anchor="end" class="axis">$20</text>
<text x="230" y="394" text-anchor="end" class="axis">$40</text>
<text x="230" y="339" text-anchor="end" class="axis">$60</text>
<text x="230" y="284" text-anchor="end" class="axis">$80</text>
<text x="230" y="229" text-anchor="end" class="axis">$100</text>
<text x="230" y="174" text-anchor="end" class="axis">$120</text>

<!-- Bar 1: IPO $45.00 (light beige) -->
<rect x="360" y="376" width="180" height="124" fill="#D9CFB5"/>
<text x="450" y="360" text-anchor="middle" class="barLabel">$45.00</text>

<!-- Bar 2: 52-week high $101.99 (gold) -->
<rect x="640" y="220" width="180" height="280" fill="#B08A3E"/>
<text x="730" y="204" text-anchor="middle" class="barLabel">$101.99</text>

<!-- Bar 3: 1 Sep 2026 close $75.24 (navy) -->
<rect x="920" y="293" width="180" height="207" fill="#0B1F33"/>
<text x="1010" y="277" text-anchor="middle" class="barLabel">$75.24</text>

<!-- X-axis labels -->
<text x="450" y="530" text-anchor="middle" class="barCat">2019 IPO price</text>
<text x="450" y="552" text-anchor="middle" class="barCatSecond">Reference price, May 2019</text>

<text x="730" y="530" text-anchor="middle" class="barCat">52-week high</text>
<text x="730" y="552" text-anchor="middle" class="barCatSecond">Preceding 12 months to 1 Sep 2026</text>

<text x="1010" y="530" text-anchor="middle" class="barCat">1 Sep 2026 close</text>
<text x="1010" y="552" text-anchor="middle" class="barCatSecond">Session before the Nigeria exit</text>

<!-- Source -->
<line x1="55" y1="580" x2="1345" y2="580" stroke="#EDE4D3" stroke-width="1"/>
<text x="55" y="596" class="source">Source: Uber IPO reference price and September 2026 market reference points used in the essay.</text>
</svg>
