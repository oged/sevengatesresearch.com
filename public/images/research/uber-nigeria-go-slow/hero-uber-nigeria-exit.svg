<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">GO SLOW</title>
<desc id="desc">Seven Gates Research signal board on Uber's 2 September 2026 Nigeria exit: the twelve-year Lagos operation wound down, 3,300 corporate jobs cut on the same day, more than $10 billion committed to autonomous mobility, and a $75.24 close for UBER on 1 September against a $101.99 fifty-two-week high.</desc>
<style>
  .eyebrow{font:700 18px Arial,sans-serif;letter-spacing:3px;fill:#B08A3E}
  .title{font:700 68px Georgia,serif;fill:#0B1F33;letter-spacing:-.5px}
  .subtitle{font:400 24px Arial,sans-serif;fill:#64707B}
  .label{font:700 14px Arial,sans-serif;letter-spacing:1px;fill:#B08A3E}
  .value{font:700 32px Georgia,serif;fill:#0B1F33;letter-spacing:-.5px}
  .valueLight{font:700 32px Georgia,serif;fill:#FFFFFF;letter-spacing:-.5px}
  .detail{font:400 17px Arial,sans-serif;fill:#0B1F33}
  .detailLight{font:400 17px Arial,sans-serif;fill:#FFFFFF}
  .labelLight{font:700 14px Arial,sans-serif;letter-spacing:1px;fill:#B08A3E}
  .source{font:400 15px Arial,sans-serif;fill:#64707B}
</style>

<rect width="1400" height="760" fill="#F5F0E6"/>
<rect x="0" y="0" width="1400" height="14" fill="#0B1F33"/>

<text x="55" y="72" class="eyebrow">SEVEN GATES RESEARCH &#183; LOKOJA CONTRARIAN</text>
<text x="55" y="152" class="title">GO SLOW</text>
<text x="55" y="200" class="subtitle">Uber left Lagos on the same day it cut 3,300 employees. Months earlier it had committed</text>
<text x="55" y="228" class="subtitle">more than $10 billion to autonomous vehicles. Not the same event. The same problem.</text>

<!-- Card 1: UBER LEFT LAGOS (navy fill) -->
<rect x="55" y="290" width="305" height="300" rx="18" fill="#0B1F33" stroke="#0B1F33" stroke-width="2"/>
<text x="79" y="338" class="labelLight">UBER LEFT LAGOS</text>
<text x="79" y="405" class="valueLight">2 Sep 2026</text>
<text x="79" y="458" class="detailLight">After twelve years, operations</text>
<text x="79" y="482" class="detailLight">wound down. Help desk closes</text>
<text x="79" y="506" class="detailLight">on 23 September.</text>

<!-- Card 2: GLOBAL LAYOFFS -->
<rect x="382" y="290" width="305" height="300" rx="18" fill="#FFFFFF" stroke="#EDE4D3" stroke-width="2"/>
<text x="406" y="338" class="label">GLOBAL LAYOFFS</text>
<text x="406" y="405" class="value">3,300</text>
<text x="406" y="458" class="detail">Corporate cut on the same day,</text>
<text x="406" y="482" class="detail">about 10% of the workforce.</text>
<text x="406" y="506" class="detail">Largest since the pandemic.</text>

<!-- Card 3: AUTONOMY BILL -->
<rect x="709" y="290" width="305" height="300" rx="18" fill="#FFFFFF" stroke="#EDE4D3" stroke-width="2"/>
<text x="733" y="338" class="label">AUTONOMY BILL</text>
<text x="733" y="405" class="value">Over $10bn</text>
<text x="733" y="458" class="detail">Committed to autonomous</text>
<text x="733" y="482" class="detail">mobility. Over $7.5bn of that</text>
<text x="733" y="506" class="detail">toward robotaxi fleets.</text>

<!-- Card 4: UBER, 1 SEP CLOSE (gold border) -->
<rect x="1036" y="290" width="305" height="300" rx="18" fill="#FFFFFF" stroke="#B08A3E" stroke-width="4"/>
<text x="1060" y="338" class="label">UBER, 1 SEP CLOSE</text>
<text x="1060" y="405" class="value">$75.24</text>
<text x="1060" y="458" class="detail">Below the $101.99 fifty-two-</text>
<text x="1060" y="482" class="detail">week high. IPO reference was</text>
<text x="1060" y="506" class="detail">$45.00 in May 2019.</text>

<line x1="55" y1="690" x2="1345" y2="690" stroke="#EDE4D3" stroke-width="2"/>
<text x="55" y="724" class="source">Sources: Uber corporate communications &#183; Reuters &#183; Uber SEC filings and 2026 results &#183; Alpaca SIP price data. Seven Gates Research, 5 September 2026.</text>
</svg>
