<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Driver overlap in Nigerian ride-hailing</title>
<desc id="desc">Bar chart contrasting approximately 21,000 headline platform driver positions with an estimated 7,388 net new jobs after adjusting for pluriactivity and duplication across platforms.</desc>
<style>
  .eyebrow{font:700 15px Arial,sans-serif;letter-spacing:2.5px;fill:#B08A3E}
  .title{font:700 32px Georgia,serif;fill:#0B1F33}
  .subtitle{font:400 18px Arial,sans-serif;fill:#64707B}
  .axis{font:400 14px Arial,sans-serif;fill:#64707B}
  .barLabel{font:700 26px Georgia,serif;fill:#0B1F33}
  .barCat{font:700 15px Arial,sans-serif;letter-spacing:.8px;text-transform:uppercase;fill:#0B1F33}
  .barCatSecond{font:400 13px Arial,sans-serif;fill:#64707B}
  .source{font:400 13px Arial,sans-serif;fill:#64707B}
</style>

<rect width="1400" height="600" fill="#F5F0E6"/>
<rect x="0" y="0" width="1400" height="10" fill="#0B1F33"/>

<text x="55" y="52" class="eyebrow">FIGURE 2 &#183; SEVEN GATES RESEARCH</text>
<text x="55" y="98" class="title">A driver can appear three times in the apps and once in the labour market</text>
<text x="55" y="128" class="subtitle">Historical Nigerian estimate adjusting platform counts for overlap and secondary work.</text>

<!-- Chart plot area -->
<!-- Y-axis: 0 to 25000, plot y from 500 (top, y=25000) to 170 (bottom, y=0) -->
<!-- Actually plot area: y from 170 (top) to 500 (bottom), height 330 -->
<!-- Data max is 21000, so scale to fit in 300 vertical px -->

<!-- Y gridlines -->
<line x1="240" y1="500" x2="1345" y2="500" stroke="#0B1F33" stroke-width="1.5"/>
<line x1="240" y1="429" x2="1345" y2="429" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="240" y1="357" x2="1345" y2="357" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="240" y1="286" x2="1345" y2="286" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="240" y1="214" x2="1345" y2="214" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>

<!-- Y-axis labels -->
<text x="230" y="504" text-anchor="end" class="axis">0</text>
<text x="230" y="433" text-anchor="end" class="axis">5,000</text>
<text x="230" y="361" text-anchor="end" class="axis">10,000</text>
<text x="230" y="290" text-anchor="end" class="axis">15,000</text>
<text x="230" y="218" text-anchor="end" class="axis">20,000</text>

<!-- Bar 1: Headline platform positions = 21,000 -->
<!-- Height: 21000/25000 * 330 = 277px, so y=500-277=223, but need to fit in 214-500 range -->
<!-- Actually: 21000 maps to (21000/25000) * (500-170) = 277.2 → y=500-277=223 -->
<rect x="380" y="223" width="220" height="277" fill="#B08A3E"/>
<text x="490" y="207" text-anchor="middle" class="barLabel">21,000</text>

<!-- Bar 2: Net new jobs = 7,388 -->
<!-- Height: 7388/25000 * 330 = 97.5 → y=500-97=403 -->
<rect x="900" y="403" width="220" height="97" fill="#0B1F33"/>
<text x="1010" y="387" text-anchor="middle" class="barLabel">7,388</text>

<!-- X-axis category labels -->
<text x="490" y="530" text-anchor="middle" class="barCat">Headline platform positions</text>
<text x="490" y="552" text-anchor="middle" class="barCatSecond">Sum of Uber, Bolt, inDrive and other platform driver counts</text>

<text x="1010" y="530" text-anchor="middle" class="barCat">Estimated net new jobs</text>
<text x="1010" y="552" text-anchor="middle" class="barCatSecond">After adjusting for multi-app overlap and secondary work</text>

<!-- Source -->
<line x1="55" y1="583" x2="1345" y2="583" stroke="#EDE4D3" stroke-width="1"/>
<text x="55" y="597" class="source" style="font-size:12px">Source: Historical Nigerian digital-taxi employment study; Seven Gates presentation. The estimate is historical and should not be read as a 2026 workforce count.</text>
</svg>
