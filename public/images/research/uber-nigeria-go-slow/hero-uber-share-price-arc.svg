<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">GO SLOW: Uber share price arc, IPO to pivot</title>
<desc id="desc">Line chart showing Uber's approximate share price journey from its May 2019 IPO reference price of $45, through the pandemic dip, 2021 rebound, 2022 tech drawdown, and 2024 to 2026 rebuild, to the $101.99 fifty-two-week high and $75.24 close on 1 September 2026, the day before Uber's Nigeria exit and 3,300-person global restructuring.</desc>
<style>
  .eyebrow{font:700 18px Arial,sans-serif;letter-spacing:3px;fill:#B08A3E}
  .title{font:700 68px Georgia,serif;fill:#0B1F33;letter-spacing:-.5px}
  .subtitle{font:400 22px Arial,sans-serif;fill:#64707B}
  .chartLabel{font:700 15px Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;fill:#B08A3E}
  .axis{font:400 14px Arial,sans-serif;fill:#64707B}
  .markerLabel{font:700 18px Georgia,serif;fill:#0B1F33}
  .markerDate{font:400 13px Arial,sans-serif;fill:#64707B}
  .annotation{font:400 13px Arial,sans-serif;fill:#64707B;font-style:italic}
  .source{font:400 13px Arial,sans-serif;fill:#64707B}
</style>

<rect width="1400" height="760" fill="#F5F0E6"/>
<rect x="0" y="0" width="1400" height="14" fill="#0B1F33"/>

<!-- Header block -->
<text x="55" y="72" class="eyebrow">SEVEN GATES RESEARCH &#183; LOKOJA CONTRARIAN</text>
<text x="55" y="152" class="title">GO SLOW</text>
<text x="55" y="196" class="subtitle">Uber left Lagos on the same day it cut 3,300 employees and after committing over</text>
<text x="55" y="224" class="subtitle">$10 billion to robotaxis. Not the same event. The same capital-allocation problem.</text>

<!-- Chart heading -->
<text x="55" y="286" class="chartLabel">UBER share price, IPO to 1 September 2026 close (USD)</text>

<!-- Chart plot area: x from 200 to 1345 (width 1145), y from 320 to 640 (height 320) -->
<!-- Y scale: 0 to 120 -->
<!-- Y positions: $0 -> 640, $120 -> 320, per $10 -> 26.67px -->
<!-- X scale: May 2019 to Sept 2026 (~7.4 years) mapped to 200..1345 -->

<!-- Y gridlines -->
<line x1="200" y1="640" x2="1345" y2="640" stroke="#0B1F33" stroke-width="1.5"/>
<line x1="200" y1="586.7" x2="1345" y2="586.7" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="533.3" x2="1345" y2="533.3" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="480" x2="1345" y2="480" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="426.7" x2="1345" y2="426.7" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="373.3" x2="1345" y2="373.3" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="200" y1="320" x2="1345" y2="320" stroke="#EDE4D3" stroke-width="1" stroke-dasharray="4 4"/>

<!-- Y labels ($USD) -->
<text x="190" y="644" text-anchor="end" class="axis">$0</text>
<text x="190" y="591" text-anchor="end" class="axis">$20</text>
<text x="190" y="537" text-anchor="end" class="axis">$40</text>
<text x="190" y="484" text-anchor="end" class="axis">$60</text>
<text x="190" y="431" text-anchor="end" class="axis">$80</text>
<text x="190" y="378" text-anchor="end" class="axis">$100</text>
<text x="190" y="324" text-anchor="end" class="axis">$120</text>

<!-- X axis year labels (2019 May at x=200, per year 153 px, 2026 Sept at x=1330) -->
<text x="200" y="665" text-anchor="middle" class="axis">2019</text>
<text x="353" y="665" text-anchor="middle" class="axis">2020</text>
<text x="505" y="665" text-anchor="middle" class="axis">2021</text>
<text x="658" y="665" text-anchor="middle" class="axis">2022</text>
<text x="811" y="665" text-anchor="middle" class="axis">2023</text>
<text x="963" y="665" text-anchor="middle" class="axis">2024</text>
<text x="1116" y="665" text-anchor="middle" class="axis">2025</text>
<text x="1330" y="665" text-anchor="middle" class="axis">2026</text>

<!-- Approximate arc:
     May 2019 IPO $45 -> (200, y=640-45*2.667=640-120=520)
     Late 2019 ~$30 -> (280, 560)
     Mar 2020 COVID low ~$15 -> (335, 600)
     End 2020 ~$50 -> (455, 507)
     Peak early 2021 ~$63 -> (520, 472)
     End 2021 ~$42 -> (620, 528)
     Mid 2022 low ~$22 -> (740, 581)
     End 2022 ~$26 -> (810, 571)
     Mid 2023 ~$44 -> (890, 523)
     End 2023 ~$62 -> (963, 475)
     Mid 2024 ~$70 -> (1040, 453)
     End 2024 ~$65 -> (1116, 467)
     Mid 2025 ~$78 -> (1195, 432)
     52-week high $101.99 -> (1265, 640 - 101.99*2.667 = 640 - 272 = 368)
     1 Sep 2026 close $75.24 -> (1330, 640 - 75.24*2.667 = 640 - 200.6 = 439.4) -->

<path d="M 200 520
         L 280 560
         L 335 600
         L 455 507
         L 520 472
         L 620 528
         L 740 581
         L 810 571
         L 890 523
         L 963 475
         L 1040 453
         L 1116 467
         L 1195 432
         L 1265 368
         L 1330 439"
      fill="none" stroke="#0B1F33" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

<!-- Anchor markers -->
<!-- IPO -->
<circle cx="200" cy="520" r="8" fill="#B08A3E" stroke="#F5F0E6" stroke-width="3"/>
<text x="214" y="500" class="markerLabel">$45.00</text>
<text x="214" y="483" class="markerDate">IPO reference, May 2019</text>

<!-- 52-week high -->
<circle cx="1265" cy="368" r="8" fill="#B08A3E" stroke="#F5F0E6" stroke-width="3"/>
<text x="1257" y="348" text-anchor="end" class="markerLabel">$101.99</text>
<text x="1257" y="331" text-anchor="end" class="markerDate">52-week high</text>

<!-- Sept 2026 close -->
<circle cx="1330" cy="439" r="8" fill="#B08A3E" stroke="#F5F0E6" stroke-width="3"/>
<text x="1320" y="472" text-anchor="end" class="markerLabel">$75.24</text>
<text x="1320" y="489" text-anchor="end" class="markerDate">1 Sep 2026 close</text>

<!-- Pandemic annotation -->
<text x="335" y="622" text-anchor="middle" class="annotation">Pandemic</text>

<!-- Source -->
<line x1="55" y1="700" x2="1345" y2="700" stroke="#EDE4D3" stroke-width="1"/>
<text x="55" y="722" class="source">Source: Uber SEC filings; Alpaca SIP price reference. IPO reference price and September 2026 anchor points are exact. Intermediate line is illustrative direction only.</text>
</svg>
