name: Apply Seven Gates Pre-Launch Patch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-gates-prelaunch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Apply pre-launch patch
        run: node scripts/apply-prelaunch-patch.mjs

      - name: Run full publication build
        run: npm run build

      - name: Commit pre-launch patch
        run: |
          if [ -z "$(git status --porcelain -- app components lib)" ]; then
            echo "No pre-launch changes to commit."
            exit 0
          fi
          git config user.name "Seven Gates Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib
          git commit -m "Apply Seven Gates pre-launch patch"
          git push origin HEAD:main
